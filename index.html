<title>Котячий притулок</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one column "game card" — stats strip, illustrated shelter room, tabs for cats / rescues / shop / more */
:root{
  --bg:#F2EEF7; --surface:#FFFFFF; --surface2:#EBE5F3; --ink:#2D2340; --muted:#6E6482; --line:#DCD3E8;
  --rose:#D94F74; --rose-ink:#FFFFFF; --rose-soft:#FBE3EA; --mint:#2A8F7A; --mint-soft:#DDF2EC; --gold:#D3921A; --gold-soft:#FBF0D8; --warn:#C8443F; --violet:#7652C4; --violet-soft:#EEE6FA; --water:#9FD3EC; --water2:#6FB6DA; --grass:#8CCB6E; --grass2:#6FB257; --cafe:#F3E3CC;
  --wall:#E7DCF2; --wall2:#D8C7E8; --floor:#C9A27E; --floor2:#B48A66; --sky:#BFE3F5; --sun-op:1; --moon-op:0; --catline:#3A2E4A;
  --display:"Comfortaa","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131F; --surface:#231D30; --surface2:#2D2640; --ink:#F0EAF7; --muted:#A99FBD; --line:#3A3150;
  --rose:#FF7C9B; --rose-ink:#2A0F18; --rose-soft:#3B2230; --mint:#5ACBB2; --mint-soft:#1E3631; --gold:#F2BE4A; --gold-soft:#3A3020; --warn:#FF8A80; --violet:#B99CF5; --violet-soft:#2E2546; --water:#1F4A66; --water2:#163A52; --grass:#2F5A3A; --grass2:#244A2E; --cafe:#3A2E26;
  --wall:#2E2742; --wall2:#3A3154; --floor:#6B5141; --floor2:#5A4334; --sky:#26355C; --sun-op:0; --moon-op:1; --catline:#120E18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131F; --surface:#231D30; --surface2:#2D2640; --ink:#F0EAF7; --muted:#A99FBD; --line:#3A3150;
  --rose:#FF7C9B; --rose-ink:#2A0F18; --rose-soft:#3B2230; --mint:#5ACBB2; --mint-soft:#1E3631; --gold:#F2BE4A; --gold-soft:#3A3020; --warn:#FF8A80; --violet:#B99CF5; --violet-soft:#2E2546; --water:#1F4A66; --water2:#163A52; --grass:#2F5A3A; --grass2:#244A2E; --cafe:#3A2E26;
  --wall:#2E2742; --wall2:#3A3154; --floor:#6B5141; --floor2:#5A4334; --sky:#26355C; --sun-op:0; --moon-op:1; --catline:#120E18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.app.fs{max-width:1100px}
.app.fs #scene3d{aspect-ratio:auto;height:max(300px,calc(100dvh - 250px));max-height:none}
.app.fs #sceneSvg>svg{max-height:calc(100dvh - 250px)}
:fullscreen body,:fullscreen{background:var(--bg);overflow-y:auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:1.45rem;letter-spacing:-.01em}
h2{font-size:1.1rem}
h3{font-size:1rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.ic{width:1.05em;height:1.05em;vertical-align:-.18em;flex:none}

header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.save{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.save.cloud i{background:var(--mint)}
.savewrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:stretch}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.lvl{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;border-radius:14px}
.lvl .row{display:flex;justify-content:space-between;gap:8px;font-size:.8rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:inherit;background:var(--rose);transition:width .4s}
.bar.mint>span{background:var(--mint)} .bar.gold>span{background:var(--gold)} .bar.low>span{background:var(--warn)}

.scene{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--wall)}
#sceneSvg>svg{display:block;width:100%;height:auto}
#scene3d{position:relative;width:100%;aspect-ratio:16/10;max-height:480px}
#scene3d canvas{display:block;width:100%;height:100%;cursor:grab}
#scene3d canvas:active{cursor:grabbing}
#bub3{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.bub3{position:absolute;transform:translate(-50%,-100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-weight:800;font-size:.74rem;white-space:nowrap}
.bub3.zz3{background:transparent;border-color:transparent;color:var(--muted);font-size:.9rem;letter-spacing:.15em}
.load3d{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--muted);z-index:2}
.scenebtns{position:absolute;z-index:3;right:10px;top:8px;display:flex;gap:6px}
.scenebtns .btn{padding:4px 10px;font-size:.78rem;background:color-mix(in srgb,var(--surface) 85%,transparent)}
.scenebtns .btn.primary{background:var(--rose);color:var(--rose-ink)}
.roombar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:-6px}
.roombar .btn{white-space:nowrap;border-radius:99px;font-size:.82rem;padding:6px 12px}
.chips2{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.rar.sick{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.rar.shine{background:linear-gradient(90deg,#FFF3C4,#FFE0EC);color:#8A5A12}
.rar.kit{background:var(--rose-soft);color:var(--rose)}
.selrow{display:flex;align-items:center;gap:6px;font-size:.82rem}
.selrow{width:100%}
.selrow select{min-width:0;flex:1;max-width:100%;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.wardrobe .slot{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.wardrobe .opts{display:flex;flex-wrap:wrap;gap:6px}
.wardrobe .opts .btn[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.groombox{position:relative;width:min(260px,70vw);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.groombox svg{position:absolute;inset:0;width:100%;height:100%}
.tuft{transition:opacity .25s,transform .25s;transform-box:fill-box;transform-origin:center}
.tuft.gone{opacity:0;transform:scale(1.6) translateY(-6px)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ach{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center}
.ach .medal{grid-row:span 2;width:44px;height:44px}
.ach .bar,.ach .btns{grid-column:1/-1}
.ach.locked .medal{opacity:.35;filter:grayscale(1)}
.itemprev{width:64px;height:64px;flex:none;background:var(--surface2);border-radius:14px;display:grid;place-items:center}
.itemprev svg{width:58px;height:58px}
.credit{margin:-6px 4px 0}
.err3d{font-size:.86rem}
.app.visiting .stats,.app.visiting #tabs,.app.visiting .hdrbtns{display:none}
.sortchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sortchips .btn{white-space:nowrap;border-radius:99px;font-size:.82rem;padding:6px 12px}
.sortchips .btn[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.lb{display:flex;flex-direction:column}
.lbrow{display:grid;grid-template-columns:28px 38px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.lbrow:first-child{border-top:0}
.lbrow.me{background:var(--rose-soft);border-radius:12px;border-top-color:transparent}
.lbrow .rank{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lbrow .who{min-width:0}
.lbrow .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .val{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lbrow .acts{grid-column:3/-1;display:flex;justify-content:flex-end}
.onl{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;color:var(--muted)}
.onl i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.onl.on{color:var(--mint);font-weight:700}.onl.on i{background:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
.credit a{color:inherit}
.scene .label{position:absolute;z-index:3;left:12px;top:10px;max-width:calc(100% - 150px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700}
.heart{position:absolute;pointer-events:none;color:var(--rose);font-weight:800;animation:float 1.1s ease-out forwards}
@keyframes float{from{opacity:1;transform:translate(-50%,-10%) scale(.8)}to{opacity:0;transform:translate(-50%,-160%) scale(1.25)}}
.scat{cursor:pointer}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:sway 3.2s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.eyes-closed{display:none}
.pose-walk{display:none}
.walking .pose-walk{display:inline}.walking .pose-sit{display:none}
.sleeping .eyes{display:none}.sleeping .eyes-closed{display:inline}
.zz{display:none}.sleeping .zz{display:inline}
.zz text{animation:zz 2.4s ease-in-out infinite}.zz text+text{animation-delay:.6s}
@keyframes zz{0%,100%{opacity:.2}50%{opacity:1}}
.sleeping .tail{animation:none}
.bubbles2d circle{animation:bub2d 6s linear infinite}
@keyframes bub2d{from{transform:translateY(40px);opacity:0}20%{opacity:.8}to{transform:translateY(-120px);opacity:0}}
.ratwheel{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tail.wag{animation:wag .55s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(8deg)}to{transform:rotate(-16deg)}}
.ftail{transform-box:fill-box;transform-origin:100% 50%;animation:fswim 1.3s ease-in-out infinite}
.walking .ftail{animation-duration:.4s}
.sleeping .ftail{animation-duration:3s}
@keyframes fswim{0%,100%{transform:scaleX(1) skewY(0)}50%{transform:scaleX(.8) skewY(7deg)}}
.leg{transform-box:fill-box;transform-origin:50% 0%}
.walking .leg.a{animation:leg .42s ease-in-out infinite alternate}
.walking .leg.b{animation:leg .42s ease-in-out infinite alternate-reverse}
.running .leg.a,.running .leg.b{animation-duration:.2s}
.walking .bodybob{animation:bob .42s ease-in-out infinite alternate}
.running .bodybob{animation-duration:.2s}
@keyframes leg{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.bubbles2d circle,.ratwheel,.tail,.ftail,.eyes,.heart,.leg,.bodybob,.zz text{animation:none!important}.bar>span{transition:none}}

.tabs{display:flex;gap:2px;position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgb(0 0 0 / .08);
  padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;padding:6px 2px 5px;border-radius:12px;font-weight:800;font-size:.72rem;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--rose);background:var(--rose-soft)}
.tabic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .dot{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--rose);border:2px solid var(--surface)}
.hdrbtns{display:flex;gap:6px}
.iconbtn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--rose);border:2px solid var(--surface)}
.sheet{position:fixed;z-index:26;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);max-height:74dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgb(0 0 0 / .18);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;animation:sheetin .22s ease-out}
.sheet::before{content:"";align-self:center;width:44px;height:5px;border-radius:9px;background:var(--line);margin-top:-6px}
@keyframes sheetin{from{transform:translate(-50%,40px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.sheethead + .setrow{border-top:0;padding-top:0}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-weight:700;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .12);color:var(--rose)}
.logitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem}
.logitem:first-child{border-top:0}
.logitem time{color:var(--muted);font-size:.78rem;white-space:nowrap}
.catsheet .cathead .pic{width:84px;height:84px}
.catsheet .cathead .pic svg{width:78px;height:78px}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.actgrid .btn{justify-content:center;padding:10px 8px}
.catcard{cursor:pointer;transition:border-color .15s}
.catcard:hover{border-color:var(--rose)}
.catcard .btns .btn{flex:1 1 auto;justify-content:center}
.chip.coinchip{position:relative}
.coinfloat{position:absolute;left:30px;top:-4px;font-weight:800;color:var(--gold);pointer-events:none;animation:coinup 1.1s ease-out forwards;white-space:nowrap}
@keyframes coinup{from{opacity:1;transform:translateY(0) scale(.9)}to{opacity:0;transform:translateY(-26px) scale(1.15)}}
.panelin{animation:panelin .2s ease-out}
@keyframes panelin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.filterbar{display:flex;flex-direction:column;gap:6px}
.st3{position:absolute;transform:translate(-50%,-100%);width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 6px rgb(0 0 0 / .15)}
.st3 svg{width:18px;height:18px}
.tutbox{position:fixed;z-index:44;width:min(340px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 32px rgb(0 0 0 / .25);display:flex;flex-direction:column;gap:8px}
.tutbox p{margin:0;font-size:.92rem}
.authform{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.authform input{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.authtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;width:100%}
.authtabs button{border:0;background:transparent;padding:8px;border-radius:9px;font-weight:800}
.authtabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.authmsg{font-size:.88rem;border-radius:10px;padding:8px 10px;background:var(--gold-soft);text-align:left;width:100%}
.authmsg.err{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.linkbtn{border:0;background:none;color:var(--rose);font-weight:700;padding:0;text-decoration:underline;cursor:pointer;align-self:flex-start}
.perkbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface2)}
.perk{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;align-items:center;padding:8px;border-radius:12px;background:var(--surface)}
.perk .btn{grid-column:1/-1;justify-content:center}
.perk .ptier{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--surface2)}
.perk.t0 .ptier{background:var(--mint-soft);color:var(--mint)}
.perk.t1 .ptier{background:var(--violet-soft);color:var(--violet)}
.perk.t2 .ptier{background:linear-gradient(135deg,#F7C948,#FF7C9B);color:#2A1F45}
.perk.locked{opacity:.7}
.stars{color:var(--gold);font-size:1.1rem;letter-spacing:1px}
.stars .muted{color:var(--line)}
.chestmodal svg.chestart{width:150px;height:130px}
.chestart .lid{transform-box:fill-box;transform-origin:0% 100%;animation:lid .7s .25s ease-out forwards}
@keyframes lid{to{transform:rotate(-38deg) translateY(-6px)}}
.chestart .glow{opacity:0;animation:glow .6s .55s ease-out forwards}
@keyframes glow{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.chestart .lid,.chestart .glow{animation:none}.chestart .glow{opacity:1}}
.chestart.static .lid,.chestart.static .glow{animation:none}.chestart.static .glow{opacity:0}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.pickgrid .card{text-align:left;gap:6px}
@media (max-width:420px){.pickgrid{grid-template-columns:1fr}}
.tut-hl{position:relative;z-index:43;box-shadow:0 0 0 4px var(--rose),0 0 0 9999px rgb(10 6 16 / .55)!important;border-radius:16px}
.tabs .tut-hl{z-index:2}
@media (prefers-reduced-motion:reduce){.sheet,.panelin,.coinfloat{animation:none}}

.panel{display:flex;flex-direction:column;gap:12px}
.tip{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cathead{display:flex;gap:10px;align-items:center}
.cathead .pic{width:64px;height:64px;flex:none;background:var(--surface2);border-radius:14px;display:grid;place-items:center}

    if (a!==c.id && b!==c.id) continue;
    const o = catById(a===c.id ? b : a); if (!o) continue;
    best = o; bp = v;
  }
  return best;
}
function addFriend(a, b, n){
  if (a===b) return;
  const k = pairKey(a,b), prev = S.friends[k] || 0;
  S.friends[k] = Math.min(99, prev + n);
  if (prev < FRIEND_BEST && S.friends[k] >= FRIEND_BEST){
    const ca = catById(a), cb = catById(b);
    if (ca && cb){ S.stats.friendsMade++; note(`${ca.name} і ${cb.name} тепер найкращі друзі! Поруч вони приносять на 10% більше монеток`); }
  }
  touch();
}

function barkSound(pitch=1, kind){

    const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.32, t+.015); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    const ng = actx.createGain(); ng.gain.value = .35;
    o.connect(bp); nz.connect(ng); ng.connect(bp); bp.connect(g); g.connect(actx.destination);
    o.start(t); nz.start(t); o.stop(t+d+.02); nz.stop(t+d+.02);
  }
}

let actx = null;
function ensureAudio(){
  if (!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; } }
  if (actx.state==='suspended') actx.resume().catch(()=>{});
}
const canPlay = () => S && S.settings.sound && actx && actx.state==='running' && !document.hidden;
function meowSound(pitch=1, kind){
  if (!canPlay()) return;
  if (S.sp==='dog') return barkSound(pitch, kind);
  if (S.sp==='rat') return squeakSound(pitch, kind);
  if (S.sp==='fish') return blubSound(pitch, kind);
  const t = actx.currentTime + 0.01;
  const d = kind==='short' ? 0.32 : kind==='long' ? 0.85 : 0.55;
  const f0 = 430*pitch, up = kind==='ask' ? 1.25 : 1.5;
  const o = actx.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(f0*0.85, t);
  o.frequency.linearRampToValueAtTime(f0*up, t+d*0.35);
  o.frequency.linearRampToValueAtTime(kind==='ask'?f0*1.4:f0*0.75, t+d);
  const vib = actx.createOscillator(), vg = actx.createGain(); vib.frequency.value = 6; vg.gain.value = f0*0.015; vib.connect(vg); vg.connect(o.frequency);
  const f1 = actx.createBiquadFilter(); f1.type='bandpass'; f1.Q.value=3.5;
  f1.frequency.setValueAtTime(600,t); f1.frequency.linearRampToValueAtTime(1700,t+d*0.3); f1.frequency.linearRampToValueAtTime(800,t+d);
  const f2 = actx.createBiquadFilter(); f2.type='bandpass'; f2.Q.value=6; f2.frequency.setValueAtTime(2600,t);
  const g2 = actx.createGain(); g2.gain.value=0.35;
  const g = actx.createGain(); const v = 0.22;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.05); g.gain.setValueAtTime(v,t+d*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4000;
  o.connect(f1); f1.connect(g); o.connect(f2); f2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(actx.destination);
  o.start(t); vib.start(t); o.stop(t+d+0.05); vib.stop(t+d+0.05);
}
function purrSound(pitch=1){
  if (!canPlay()) return;
  if (S.sp==='dog') return barkSound(pitch*1.3, 'short');
  if (S.sp==='rat') return squeakSound(pitch*1.1, 'long');
  if (S.sp==='fish') return blubSound(pitch, 'long');
  const t = actx.currentTime + 0.01, d = 1.4;
  const o = actx.createOscillator(); o.type='sawtooth'; o.frequency.value = 70*pitch;
  const am = actx.createOscillator(), amg = actx.createGain(); am.frequency.value = 24; amg.gain.value = 0.5;
  const g = actx.createGain(); g.gain.value = 0;
  const base = actx.createGain(); base.gain.setValueAtTime(0.0001,t); base.gain.exponentialRampToValueAtTime(0.18,t+0.25); base.gain.setValueAtTime(0.18,t+d-0.4); base.gain.exponentialRampToValueAtTime(0.0001,t+d);
  am.connect(amg); amg.connect(g.gain);
  const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 500;
  o.connect(lp); lp.connect(g); g.connect(base); base.connect(actx.destination);
  o.start(t); am.start(t); o.stop(t+d); am.stop(t+d);
}

function decide(b){
  release(b); b.bedT = null;
  const cat = catById(b.id); if (!cat) return;
  const t = now(), u = S.upgrades;
  if (b.y < YMIN-5){ jumpTo(b, rand(292,312), rand(156,166), 520, ()=>{ b.mode='idle'; b.until=now()+rand(1500,3000); }); return; }

  const bf = bestFriendOf(cat), bfb = bf && brains.get(bf.id);
  if (bfb && !bfb.busy && (bfb.mode==='idle'||bfb.mode==='walk') && bfb.y>=YMIN-2 && Math.random()<0.3){ social(b, bfb, rnd(['nap','nuzzle'])); return; }

    else { meowCat(b,'Їсти!','ask'); b.until=t+rand(3000,5000); }
    return;
  }
  const others = freeCats(b);
  const perched = [...brains.values()].some(o=>o.y<YMIN-5 || (o.mode==='jump' && o.jy1<YMIN));
  const opts = [
    [35, ()=> walkTo(b, rand(XMIN+10,XMAX-10), rand(YMIN+3,YMAX-3), rand(18,26))],

function social(a, o, forced){

      if (!R3.ray.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0), -ROOM3.floorY), pt)) return;

function applyNight(force){

  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#F2EEF7';
  R3.scene.background = new R3.T.Color(S && S.sp==='fish' ? (night ? '#0E2238' : '#2E7FB8') : R3.envRoomName==='yard' ? (night ? '#16213D' : '#BFE3F5') : bg);

  if (R3.props) R3.props.visible = room==='main' && S.sp!=='fish';

function buildGeoms(){
  const T = R3.T;
  const sphZ = new T.SphereGeometry(1, 28, 18); sphZ.rotateX(Math.PI/2);
  R3.G = { sph: new T.SphereGeometry(1, 24, 16), sphZ, cone: new T.ConeGeometry(1, 1, 14), cyl: new T.CylinderGeometry(1, 0.85, 1, 12),
    disc: new T.CircleGeometry(1, 24) };
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(0,0,0,.55)'); gr.addColorStop(1,'rgba(0,0,0,0)');

}
function seeded(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h<<13; h ^= h>>>17; h ^= h<<5; return ((h>>>0)%10000)/10000; }; }
function mix(hex, f){ const c = new R3.T.Color(hex); c.lerp(new R3.T.Color(f>0?'#ffffff':'#000000'), Math.abs(f)); return '#'+c.getHexString(); }
function ell(g, x, y, rx, ry, col){ g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); g.fill(); }
function coatTex(coat, part){
  const key = coat+part; if (R3.tex.has(key)) return R3.tex.get(key);
  const k = COATS[coat], W = 256, H = 128, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), r = seeded(key);
  g.fillStyle = k.base; g.fillRect(0,0,W,H);
  const light = mix(k.base, 0.38);
  if (part==='body'){
    // u=0.25 живіт, u=0.75 спинка; верх текстури — груди, низ — хвостик
    if (['none','stripes','spots','points'].includes(k.pattern)){ g.filter = 'blur(7px)'; ell(g, W*.25, H*.5, W*.1, H*.46, light); g.filter = 'none'; }
    if (k.pattern==='stripes'){ g.strokeStyle = k.accent; g.lineWidth = 8; g.lineCap = 'round';
      for (let i=0;i<7;i++){ const y = 14+i*16; g.beginPath(); g.moveTo(W*.46, y+6); g.quadraticCurveTo(W*.75, y-8, W*1.02, y+6); g.stroke(); } }
    else if (k.pattern==='spots'){ for (let i=0;i<26;i++) ell(g, W*(.4+r()*.62)%W, 6+r()*(H-12), 4+r()*4, 3+r()*3, k.accent); }
    else if (k.pattern==='patches'){ for (let i=0;i<6;i++) ell(g, W*(.3+r()*.7), r()*H, 18+r()*18, 12+r()*14, i%2 ? (k.accent2||k.accent) : k.accent); }
    else if (k.pattern==='tuxedo'){ ell(g, W*.25, H*.22, W*.14, H*.6, k.accent); }
    else if (k.pattern==='socks'){ ell(g, W*.25, H*.1, W*.12, H*.32, k.accent); }
  } else {

    if (k.pattern==='stripes'){ g.fillStyle = k.accent; for (const x of [55,64,73]) g.fillRect(x-2.5, 18, 5, 24);
      g.fillRect(14, 64, 22, 4); g.fillRect(92, 64, 22, 4); g.fillRect(150, 30, 60, 6); g.fillRect(150, 50, 60, 6); }
    else if (k.pattern==='spots'){ for (let i=0;i<10;i++) ell(g, 30+r()*190, 8+r()*36, 3, 3, k.accent); }
    else if (k.pattern==='patches'){ ell(g, W*.36, H*.3, 24, 22, k.accent2||k.accent); ell(g, W*.13, H*.32, 16, 16, k.accent); ell(g, W*.7, H*.5, 30, 26, k.accent); }
    else if (k.pattern==='tuxedo'){ ell(g, W*.25, H*.8, 26, 32, k.accent); ell(g, W*.25, H*.5, 5, 22, k.accent); }
    else if (k.pattern==='points'){ g.filter = 'blur(8px)'; ell(g, W*.25, H*.6, 30, 30, k.accent); g.filter = 'none'; }

  R3.tex.set(key, t); return t;
}
function makeCat3D(c, bare){

    ear.add(mesh(G.cone, earM, [0, .028, 0], [.031, .058, .02]));

    const pv = new T.Group();
    if (front){ pv.position.set(sx*.046, .0, .17); bodyG.add(pv); } else { pv.position.set(sx*.048, .11, -.075); rig.add(pv); }
    const m = mesh(G.cyl, legM, [0, -.05, 0], [.021, .1, .021]);

function sync3D(){
  if (R3.state!=='ready') return;
  for (const [id, o] of R3.cats){
    const c = catById(id);
    if (!brains.has(id) || !c || wearSig(c)!==o.sig){ R3.catGroup.remove(o.root); R3.cats.delete(id); const bb = R3.bubbles.get(id); if (bb){ bb.remove(); R3.bubbles.delete(id); } const se = R3.stats.get(id); if (se){ se.remove(); R3.stats.delete(id); } }
  }
  for (const id of brains.keys()){
    if (R3.cats.has(id)) continue;
    const c = catById(id); if (!c) continue;
    const o = makeAnimal3D(c); R3.cats.set(id, o); R3.catGroup.add(o.root);
    const b = brains.get(id), p = w3(b.x, b.y); o.root.position.set(p.x, p.y, p.z); o.root.rotation.y = o.heading;
  }
}

/* ---------- кадр ---------- */
function update3D(dt){
  const t = now(), T = R3.T;
  if (t - R3.nightAt > 1500){ R3.nightAt = t; applyNight(false); }
  R3.controls.update();
  const camPos = R3.camera.position;
  for (const [id, o] of R3.cats){
    const b = brains.get(id); if (!b) continue;
    let p;
    if (b.mode==='jump'){ const pr = clamp((t-b.t0)/b.dur, 0, 1), a = w3(b.jx0, b.jy0), e = w3(b.jx1, b.jy1);
      p = {x:a.x+(e.x-a.x)*pr, y:a.y+(e.y-a.y)*pr+Math.sin(Math.PI*pr)*.32, z:a.z+(e.z-a.z)*pr}; }
    else p = w3(b.x, b.y);
    const dx = p.x - o.root.position.x, dz = p.z - o.root.position.z, moved = Math.hypot(dx, dz);
    o.root.position.set(p.x, p.y, p.z);
    const moving = b.mode==='walk' || b.mode==='jump';
    let th = o.heading;
    if (moving && moved > 0.0006) th = Math.atan2(dx, dz);
    else if (b.partner && brains.has(b.partner.id)){ const q = w3(b.partner.x, b.partner.y); if (Math.hypot(q.x-p.x, q.z-p.z) > .05) th = Math.atan2(q.x-p.x, q.z-p.z); }
    else if (b.mode==='perch' || (b.mode==='idle' && t < b.sayUntil)) th = Math.atan2(camPos.x-p.x, camPos.z-p.z);
    let d = th - o.heading; d = Math.atan2(Math.sin(d), Math.cos(d));
    o.heading += d * Math.min(1, dt*7); o.root.rotation.y = o.heading;
    const sitT = (b.mode==='idle' || b.mode==='wait' || b.mode==='perch') ? 1 : 0, lieT = b.mode==='sleep' ? 1 : 0;
    o.sit += (sitT - o.sit) * Math.min(1, dt*5); o.lie += (lieT - o.lie) * Math.min(1, dt*3);
    const run = b.mode==='walk' && b.speed > 40;
    if (o.fish){
      const l = o.lie;
      o.rig.position.y = .19 - .12*l + Math.sin(t/650 + id)*.012;
      o.bodyG.rotation.z = .35*l; o.bodyG.rotation.x = moving ? -.08 : 0;
      o.tailBase.rotation.y = Math.sin(t/(moving ? (run ? 60 : 95) : 260) + id) * (l > .5 ? .15 : .5);
      o.fins.forEach((f, i) => f.rotation.y = Math.sin(t/220 + i*1.6) * .5);
      o.shadow.visible = true; o.shadow.material.opacity = .5;
      if (o.sparks){ o.sparks.rotation.y += dt*.8; o.sparks.material.opacity = .55 + .35*Math.sin(t/300); }
    } else {
    if (moving) o.phase += dt * (run ? 17 : 10);
    const sw = moving ? Math.sin(o.phase) * (run ? .8 : .55) : 0;
    const s = o.sit * (1-o.lie), l = o.lie;
    o.bodyG.rotation.x = -.62*s;
    o.rig.position.y = -.06*l + (moving ? Math.abs(Math.sin(o.phase))*.007 : 0);
    o.headG.rotation.x = .55*s + .35*l; o.headG.position.y = .115 - .035*l; o.headG.rotation.y = l ? .5*l : 0;
    for (const L of o.legs){
      let rot, len;
      if (L.front){ rot = (L.sx>0 ? sw : -sw) + .62*s; len = 1 + 1.0*s - .7*l; }
      else { rot = (L.sx>0 ? -sw : sw) - .95*s; len = 1 - .4*s - .7*l; }
      const lk = len*(o.legK||1); L.pv.rotation.x = rot; L.m.scale.y = .1*lk; L.m.position.y = -.05*lk; L.paw.position.y = -.1*lk;
    }
    o.tailBase.rotation.x = (o.tailX0 ?? -1.05) - .75*s*(o.tailX0 ? .3 : 1) - .45*l;
    o.segs.forEach((sg, i) => { sg.rotation.x = (o.tailX0===-1.5 ? .08 : .3)*(1-l) - .05*s; sg.rotation.z = o.wag ? Math.sin(t/85 + i*.4) * .45 * (1-l) : Math.sin(t/450 + i*.6) * (moving ? .1 : .2) * (1-l) + .42*l; });

    const l = o.lie;

      if (!el){ el = document.createElement('div'); el.className = 'bub3'; document.getElementById('bub3').appendChild(el); R3.bubbles.set(id, el); }
      if (el.textContent !== txt) el.textContent = txt;

      const v = new T.Vector3(p.x, p.y + (.36 - .1*l)*CAT_S*(o.root.scale.x/CAT_S), p.z).project(R3.camera);
      const box = R3.renderer.domElement;

    } else if (el && !el.hidden) el.hidden = true;
    const cc = catById(id), st = !txt && cc ? catStatus(cc) : '';

    if (st){
      if (!se){ se = document.createElement('div'); se.className = 'st3'; document.getElementById('bub3').appendChild(se); R3.stats.set(id, se); }
      if (se.dataset.st !== st){ se.dataset.st = st; se.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${STAT_ICON[st]}</svg>`; }
      const v = new T.Vector3(p.x, p.y + (.36 - .1*l)*CAT_S*(o.root.scale.x/CAT_S), p.z).project(R3.camera), box = R3.renderer.domElement;
      se.hidden = v.z > 1; se.style.left = ((v.x+1)/2*box.clientWidth).toFixed(1)+'px'; se.style.top = ((1-v.y)/2*box.clientHeight).toFixed(1)+'px';
    } else if (se && !se.hidden) se.hidden = true;

  const env = R3.envs[R3.envRoom];

    if (ch.userData.spin) ch.rotation.z -= dt*2.2;

  R3.renderer.render(R3.scene, R3.camera);
}

let shownCoins = null, coinRaf = 0;
function animateCoins(target){
  const el = document.getElementById('coins');
  if (shownCoins === null || matchMedia('(prefers-reduced-motion: reduce)').matches){ shownCoins = target; el.textContent = target.toLocaleString('uk-UA'); return; }
  if (target === shownCoins) return;
  const diff = target - shownCoins;
  if (diff >= 5){ const f = document.createElement('span'); f.className = 'coinfloat'; f.textContent = '+' + diff.toLocaleString('uk-UA'); el.parentNode.appendChild(f); setTimeout(()=>f.remove(), 1200); }
  const from = shownCoins, t0 = performance.now(), dur = Math.abs(diff) > 1 ? 550 : 1;
  shownCoins = target; cancelAnimationFrame(coinRaf);
  const step = ts => { const k = Math.min(1, (ts - t0)/dur), e = 1 - Math.pow(1-k, 3); el.textContent = Math.round(from + (target-from)*e).toLocaleString('uk-UA'); if (k < 1) coinRaf = requestAnimationFrame(step); };
  coinRaf = requestAnimationFrame(step);
}

  if (S.active.length){
    h += `<div class="section"><h2>В дорозі</h2><div class="grid">`;
    for (const a of S.active){
      const sit = sitById(a.sit);
      h += `<article class="card ${now()>=a.endsAt?'ready':'active'}" data-activecard="${a.id}">
        <div class="cathead"><div class="pic">${now()>=a.endsAt?catSVG({coat:a.coat},'a'+a.id):`<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="50" cy="50" r="30" fill="none" stroke="var(--mint)" stroke-width="6" stroke-dasharray="20 12"/></svg>`}</div>
        <div><b>${sit.t}</b><span class="small muted" data-atext="${a.id}"></span></div></div>
        <div class="bar mint" data-abar="${a.id}"><span></span></div>
        <div class="btns"><button class="btn primary" data-act="collect" data-id="${a.id}" data-abtn="${a.id}" ${now()>=a.endsAt?'':'hidden'}>Забрати котика</button></div>
      </article>`;
    }
    h += `</div></div>`;
  }
  h += `<div class="section"><h2>Хтось потребує допомоги</h2><p class="small muted">Прочитай історію і вибери, що взяти з собою. Нові випадки з’являються кожні півтори хвилини.</p>`;
  if (!S.missions.length) h += `<div class="card"><p>Поки все спокійно. Наступний виклик <span data-nextm></span>.</p></div>`;
  h += `<div class="grid">`;
  for (const m of S.missions){
    const sit = sitById(m.sit);
    const hidden = now() < m.hideUntil;
    h += `<article class="card mission">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h3>${sit.t}</h3><span class="small muted">${rescueTime(sit)} с</span></div>
      <p class="story" style="margin:0">${sit.d}</p>

      <div class="q" data-mhide="${m.id}">${hidden?'':'Що візьмеш?'}</div>
      <div class="btns">${Object.keys(TOOLS).filter(k=>S.tools[k]).map(k=>[k,toolOf(k)]).map(([k,t])=>`<button class="btn" data-act="try" data-id="${m.id}" data-tool="${k}" data-mbtn="${m.id}">${t.n}</button>`).join('')}</div>
    </article>`;
  }
  h += `</div>`;
  const locked = Object.keys(TOOLS).filter(k=>!S.tools[k]).map(k=>[k,toolOf(k)]);
  if (locked.length) h += `<p class="small muted">Більше спорядження: ${locked.map(([k,t])=>t.n).join(', ')} — у магазині.</p>`;
  const nextSit = sits().find(s=>s.lvl>l);
  if (nextSit) h += `<p class="small muted">На ${nextSit.lvl} рівні притулку з’являться нові випадки.</p>`;
  const od0 = rescueOdds(0), od2 = rescueOdds(2);
  h += `<p class="small muted">Шанс знайти особливого котика: ${Math.round(od0.special*100)}–${Math.round(od2.special*100)}%, рідкісного: ${Math.round(od0.rare*100)}–${Math.round(od2.rare*100)}%, епічного: ${(od0.epic*100).toFixed(1)}–${(od2.epic*100).toFixed(1)}% (у складніших випадках більше). Покращення «Досвідчені рятувальники» підвищує шанси. Легендарні й міфічні котики бувають лише в колесі фортуни.</p>`;
  return h + `</div>`;
}

/* live numbers without re-rendering */
function liveUpdate(){
  const t = now();
  for (const c of S.cats){
    document.querySelectorAll(`[data-hbar="${c.id}"]`).forEach(hb=>{ hb.firstElementChild.style.width=c.hunger+'%'; hb.classList.toggle('low',c.hunger<30); });
    document.querySelectorAll(`[data-hval="${c.id}"]`).forEach(x=>x.textContent=Math.round(c.hunger));
    document.querySelectorAll(`[data-pbar="${c.id}"]`).forEach(pb=>{ pb.firstElementChild.style.width=c.happy+'%'; pb.classList.toggle('low',c.happy<30); });
    document.querySelectorAll(`[data-pval="${c.id}"]`).forEach(x=>x.textContent=Math.round(c.happy));
    document.querySelectorAll(`[data-pcd="${c.id}"]`).forEach(pc=>{ const left=Math.ceil((c.petAt+20000-t)/1000); pc.disabled=left>0; const h = left>0?`Мурчить… ${left}с`:`${ICON.heart} Погладити`; if (pc.innerHTML!==h) pc.innerHTML = h; });
    document.querySelectorAll(`[data-plcd="${c.id}"]`).forEach(pl=>{ const left=Math.ceil((c.playAt+60000-t)/1000); pl.disabled=left>0; pl.textContent = left>0?`Відпочиває ${left}с`:'Гратися'; });
  }
  document.querySelectorAll('[data-bulk]').forEach(btn => { const n = bulkList[btn.dataset.bulk]().length, sp = btn.querySelector('.bcount');
    const dis = !n || (btn.dataset.bulk==='feed' && S.food <= 0); if (btn.disabled !== dis) btn.disabled = dis; const tx = n ? ` · ${n}` : ''; if (sp && sp.textContent !== tx) sp.textContent = tx; });
  const inc=document.querySelector('[data-income]'); if(inc) inc.textContent=incomePerMin().toFixed(1);
  const fmtLeft = ms => { const m = Math.max(0, Math.ceil(ms/60000)); return m>=60 ? `${Math.floor(m/60)} год ${m%60} хв` : `${m} хв`; };
  for (const c of S.cats){
    if (c.kitten) document.querySelectorAll(`[data-kit="${c.id}"]`).forEach(k=>k.textContent = `Кошеня · ${fmtLeft(c.bornAt+KITTEN_MS-t)}`);
    if (c.treatUntil) document.querySelectorAll(`[data-treat="${c.id}"]`).forEach(tr=>tr.textContent = `У ветеринара · ще ${Math.max(0,Math.ceil((c.treatUntil-t)/1000))} с`);
    document.querySelectorAll(`[data-shine="${c.id}"]`).forEach(sh=>sh.textContent = `Блищить ×1.25 · ${fmtLeft(c.shinyUntil-t)}`);
  }
  for (const a of S.active){
    const sit=sitById(a.sit), total=rescueTime(sit)*1000, start=a.endsAt-total;
    const bar=document.querySelector(`[data-abar="${a.id}"]`);
    if (!bar) continue;
    const done = t>=a.endsAt;
    bar.firstElementChild.style.width = clamp((t-start)/total*100,0,100)+'%';
    document.querySelector(`[data-atext="${a.id}"]`).textContent = done?'Котик у безпеці!':`Рятувальник на місці, ще ${Math.ceil((a.endsAt-t)/1000)} с`;
    const btn=document.querySelector(`[data-abtn="${a.id}"]`); if (done && btn.hidden){ renderTab(); return; }
  }
  for (const m of S.missions){
    const hidden = t < m.hideUntil;
    const q=document.querySelector(`[data-mhide="${m.id}"]`);
    if (q) q.textContent = hidden ? `Котик сховався. Спробуй ще раз за ${Math.ceil((m.hideUntil-t)/1000)} с` : 'Що візьмеш?';
    document.querySelectorAll(`[data-mbtn="${m.id}"]`).forEach(b=>b.disabled=hidden);
  }
  for (const e of S.exp){ const el = document.querySelector(`[data-expleft="${e.id}"]`); if (el){ if (t >= e.endsAt){ renderTab(); return; } el.textContent = `Повернеться за ${fmtDur(e.endsAt-t)}`; } }
  const nm=document.querySelector('[data-nextm]'); if(nm) nm.textContent = `через ${Math.max(0,Math.ceil((S.nextMissionAt-t)/1000))} с`;
  const nv=document.querySelector('[data-nextv]'); if(nv) nv.textContent = S.cats.length ? `через ${Math.max(0,Math.ceil((S.nextVisitorAt-t)/1000))} с` : 'прийде, коли в притулку будуть котики';
  for (const v of S.visitors){ const el=document.querySelector(`[data-vleft="${v.id}"]`); if (el) el.textContent = `піде через ${Math.max(0,Math.ceil((v.until-t)/60000))} хв`; }

/* ---------- догляд за всіма одразу ---------- */
const bulkList = {
  feed: () => S.cats.filter(c => !c.away && !c.treatUntil && c.hunger < 95).sort((a, b) => a.hunger - b.hunger),
  pet:  () => S.cats.filter(c => !c.away && !c.treatUntil && now() >= c.petAt + 20000),
  play: () => S.cats.filter(c => !c.away && !c.treatUntil && now() >= c.playAt + 60000)
};
function feedAll(){
  const list = bulkList.feed();
  if (!list.length){ toast('Усі котики ситі'); return; }
  if (S.food <= 0){ toast('Корм закінчився. Купи його в магазині'); return; }
  let n = 0;
  for (const c of list){ if (S.food <= 0) break;
    S.food--; c.hunger = clamp(c.hunger+40, 0, 100); c.happy = clamp(c.happy+3, 0, 100); S.stats.fed++; gainXp(1); task('feed'); n++;
    if (c.kitten) c.bornAt -= 3*60000; }
  toast(n < list.length ? `Нагодовано котиків: ${n}. Корм закінчився, ще ${list.length - n} голодних` : `Нагодовано котиків: ${n}`);
  const b = [...brains.values()][0]; if (b) meowCat(b, 'Ням!', 'short');
  touch(true); renderTop(); renderTab();
}
function petAll(){
  const list = bulkList.pet();
  if (!list.length){ toast('Котики ще мурчать після минулого разу. Спробуй трохи згодом'); return; }
  let coins = 0;
  for (const c of list){ c.petAt = now(); c.happy = clamp(c.happy+15, 0, 100); const pb = 1 + Math.round(perkVal(c,'pet')*100); coins += pb; S.stats.pets++; gainXp(1); task('pet');
    const b = brains.get(c.id); if (b){ b.mode = b.y < YMIN-5 ? 'perch' : b.mode==='sleep' ? 'sleep' : 'idle'; b.until = now()+3000; say(b, 'Мурр'); } }
  S.coins += coins; S.stats.coinsEarned += coins;
  const b = [...brains.values()][0]; if (b) purrSound(b.pitch);
  toast(`Погладжено котиків: ${list.length}. +${coins} монеток`);
  touch(); renderTop(); renderTab();
}
function playAll(){
  if (S.upgrades.toys < 1) return;
  const list = bulkList.play();
  if (!list.length){ toast('Котики ще відпочивають після гри'); return; }
  for (const c of list){ c.playAt = now(); c.happy = clamp(c.happy+25, 0, 100); gainXp(2); }
  const bs = [...brains.values()]; if (bs.length) bs.forEach((b, i) => i < 4 && setTimeout(() => brains.has(b.id) && playBall(b), i*400));
  toast(`Пограли з котиками: ${list.length}. Усі веселі!`);
  touch(); renderTop(); renderTab();
}
function petCat(id, evt){
  const c = catById(id); if (!c) return;
  if (visiting){ if (evt) heart(evt, 'мур'); catReact(id, true); return; }
  try { if (navigator.vibrate && now() >= c.petAt+20000) navigator.vibrate(12); } catch(e){}
  if (now() < c.petAt+20000){ if (evt) heart(evt, 'мур'); catReact(id, false); return; }
  c.petAt = now(); c.happy = clamp(c.happy+15,0,100); const pb = 1 + Math.round(perkVal(c,'pet')*100); S.coins += pb; S.stats.coinsEarned += pb; S.stats.pets++; gainXp(1); task('pet');
  catReact(id, true);
  if (evt) heart(evt, '+' + pb); else toast(`${c.name} замурчав`);
  touch(); renderTop(); liveUpdate();
}
function heart(evt, text){
  const sc = document.getElementById('scene'), r = sc.getBoundingClientRect();
  const h = document.createElement('div'); h.className='heart';
  h.innerHTML = ICON.heart + ' ' + text;
  h.style.left = (evt.clientX - r.left)+'px'; h.style.top = (evt.clientY - r.top)+'px';
  sc.appendChild(h); setTimeout(()=>h.remove(), 1200);
}

const VISITOR_NAMES = ['Оля','Андрій','Бабуся Ніна','Марко','Софійка','Тарас','Ірина','Дмитро','Катруся','Пан Василь','Христина','Юля','Назар','Пані Галина'];
const AVA_COLORS = ['var(--rose)','var(--mint)','var(--gold)','var(--violet)'];
const VISIT_MS = 8*60000, VISIT_EVERY = 100000;
function genVisitor(){
  const cats = S.cats; if (!cats.length) return null;
  const lv = level(), m = 1 + 0.12*(lv-1);
  const maxRar = Math.max(...cats.map(c=>COATS[c.coat].rar));
  const maxLvl = Math.max(...cats.map(c=>c.lvl||1));
  const kinds = ['coat','trait','happy','coat','trait'];
  if (maxRar>=1) kinds.push('rar');
  if (maxLvl>=2 || lv>=3) kinds.push('lvl');
  const kind = rnd(kinds);
  let v = {id:S.uid++, name:rnd(VISITOR_NAMES), kind, until:now()+VISIT_MS, color:Math.floor(Math.random()*AVA_COLORS.length)};
  if (kind==='coat'){ v.p = Math.random()<0.75 ? rnd(cats).coat : rnd(coatsOf(S.sp).filter(k=>COATS[k].rar<=1 && !COATS[k].secret)); v.r = 25; }
  else if (kind==='trait'){ v.p = Math.random()<0.75 ? rnd(cats).trait : rnd(TRAITS); v.r = 25; }
  else if (kind==='happy'){ v.p = rnd([60,70,80]); v.r = 12 + Math.round(v.p/5); }
  else if (kind==='rar'){ v.p = Math.max(1, Math.min(maxRar, 1+Math.floor(Math.random()*maxRar))); v.r = 20 + 15*v.p; }
  else { v.p = Math.max(2, Math.min(maxLvl, 2+Math.floor(Math.random()*3))); v.r = 15 + 10*v.p; }
  v.r = Math.round(v.r*m);
  return v;
}
function visitorText(v){
  if (v.kind==='coat') return `Хоче познайомитися з котиком забарвлення «${COATS[v.p].n}».`;
  if (v.kind==='trait') return `Шукає котика з характером «${v.p}».`;
  if (v.kind==='happy') return `Хоче погратися з веселим котиком (настрій від ${v.p}).`;
  if (v.kind==='rar') return `Мріє побачити котика рідкості «${RAR_NAMES[v.p]}» або кращої.`;
  return `Хоче познайомитися з котиком ${v.p} рівня або вище.`;
}
function matchCats(v){
  const t = now();
  return S.cats.filter(c => !c.away && t - (c.shownAt||0) > 90000 && (
    v.kind==='coat' ? c.coat===v.p :
    v.kind==='trait' ? c.trait===v.p :
    v.kind==='happy' ? c.happy>=v.p :
    v.kind==='rar' ? COATS[c.coat].rar>=v.p :
    (c.lvl||1)>=v.p));
}
function spawnVisitors(force){
  const t = now();
  const before = S.visitors.length;
  S.visitors = S.visitors.filter(v=>v.until>t);
  let added = 0;
  const vmax = S.rooms.cafe ? 4 : 3, every = VISIT_EVERY * (S.rooms.cafe ? 0.6 : 1);
  while (S.visitors.length < vmax && S.cats.length && (force || t >= S.nextVisitorAt)){
    const v = genVisitor(); if (!v) break;
    S.visitors.push(v); S.nextVisitorAt = t + every; added++;
    if (!force) break;
  }
  return added || (S.visitors.length!==before);
}

const FISH_MAX = 5, FISH_REGEN = 6*60000, FISH_SECONDS = 20;

function fishRegen(){
  const f = S.fish, t = now();
  if (f.energy >= FISH_MAX){ f.regenAt = 0; return; }
  if (!f.regenAt) f.regenAt = t + FISH_REGEN;
  while (f.energy < FISH_MAX && t >= f.regenAt){ f.energy++; f.regenAt += FISH_REGEN; }
  if (f.energy >= FISH_MAX) f.regenAt = 0;
}

function pickFish(){ const tot = FISH_TYPES.reduce((a,f)=>a+f.w,0); let x = Math.random()*tot; for (const f of FISH_TYPES){ x-=f.w; if (x<=0) return f; } return FISH_TYPES[0]; }
function startFish(){
  fishRegen();
  if (fish.running || S.fish.energy<=0) return;
  S.fish.energy--; if (!S.fish.regenAt) S.fish.regenAt = now()+FISH_REGEN;
  touch();
  const pond = document.getElementById('pond'); if (!pond) return;
  fish.running = true; fish.score = 0; fish.caught = 0; fish.endAt = now() + FISH_SECONDS*1000;
  pond.innerHTML = `<div class="pondhud"><span id="fishScore">Улов: 0</span><span id="fishTime">${FISH_SECONDS} с</span></div>`;
  for (let i=0;i<5;i++){ const r=document.createElement('div'); r.className='ripple'; r.style.left=(10+Math.random()*75)+'%'; r.style.top=(25+Math.random()*65)+'%'; pond.appendChild(r); }
  document.getElementById('fishStart')?.setAttribute('disabled','');
  const fe = document.getElementById('fishEnergy'); if (fe) fe.textContent = `${S.fish.energy} / ${FISH_MAX}`;
  const spawn = () => {
    if (!fish.running) return;
    const left = fish.endAt - now();
    if (left <= 0){ endFish(false); return; }
    const t = pickFish();
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'fishbtn'; b.setAttribute('aria-label', t.k==='boot'?MINI_().bad:MINI_().good);
    b.style.left = (12 + Math.random()*76) + '%'; b.style.top = (24 + Math.random()*66) + '%';
    b.innerHTML = miniSVG(t);
    b.addEventListener('pointerdown', e=>{ e.preventDefault(); catchFish(b, t); }, {once:true});
    pond.appendChild(b);
    const life = Math.max(750, 1500 - (FISH_SECONDS*1000-left)/25);
    fish.timers.push(setTimeout(()=>{ if (b.isConnected && !b.classList.contains('gone')){ b.classList.add('gone'); setTimeout(()=>b.remove(), 260); } }, life));
    const gap = Math.max(330, 700 - (FISH_SECONDS*1000-left)/45);
    fish.timers.push(setTimeout(spawn, gap));
  };
  const clock = setInterval(()=>{
    const el = document.getElementById('fishTime');
    if (!fish.running){ clearInterval(clock); return; }
    if (el) el.textContent = Math.max(0, Math.ceil((fish.endAt-now())/1000)) + ' с';
  }, 250);
  fish.timers.push(clock);
  spawn();
}
function catchFish(b, t){
  if (!fish.running || b.classList.contains('gone')) return;
  b.classList.add('gone'); setTimeout(()=>b.remove(), 260);
  fish.score = Math.max(0, fish.score + t.v);
  if (t.v>0) fish.caught++;
  const pond = document.getElementById('pond');
  if (pond){ const p = document.createElement('div'); p.className = 'plus' + (t.v<0?' bad':''); p.textContent = (t.v>0?'+':'') + t.v; p.style.left = b.style.left; p.style.top = b.style.top; pond.appendChild(p); setTimeout(()=>p.remove(), 950); }
  const sc = document.getElementById('fishScore'); if (sc) sc.textContent = 'Улов: ' + fish.score;
  if (t.v>0 && canPlay()) tickSound(); 
}
function endFish(silent){
  if (!fish.running) return;
  fish.running = false;
  fish.timers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); fish.timers = [];
  const reward = Math.round(fish.score * fishMult() * (1 + perkSum('fish', .5)) * (hasDecor('fountain') ? 1.15 : 1));
  const shN = Math.floor(fish.score/15); if (shN > 0 && !silent){ const got = giveRandomShards(shN, [30,35,25,10,0,0,0]); setTimeout(() => toast('Знайдено ' + shardText(got)), 900); }
  if (fish.score >= 35 && !silent) setTimeout(() => trySecret('mini'), 2400);
  S.coins += reward; S.stats.coinsEarned += reward; S.fish.plays++;
  const best = fish.score > S.fish.best; if (best) S.fish.best = fish.score;
  gainXp(Math.min(15, 2 + Math.floor(fish.caught/3)));
  touch(true); renderTop();
  task('fish');
  const pond = document.getElementById('pond');
  if (!silent && pond){
    pond.querySelectorAll('.fishbtn').forEach(b=>b.remove());

}

  const n = WHEEL.length, R = 118, step = 360/n;
  const pt = (deg, r) => { const a = deg*Math.PI/180; return [ (r*Math.sin(a)).toFixed(2), (-r*Math.cos(a)).toFixed(2) ]; };
  let segs = '';
  WHEEL.forEach((seg,i)=>{
    const a0 = i*step, a1 = (i+1)*step, [x0,y0] = pt(a0,R), [x1,y1] = pt(a1,R);
    const [fill, ink] = segFill(seg);
    segs += `<path d="M0 0L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${fill}" stroke="var(--line)" stroke-width="1.5"/>`;
    segs += `<g transform="rotate(${a0+step/2})"><text y="-84" text-anchor="middle" font-family="Comfortaa,Nunito,sans-serif" font-weight="700" font-size="${seg.k==='cat'?11:15}" fill="${ink}">${seg.label}</text><text y="-70" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="7.5" fill="${ink}" opacity=".85">${seg.sub}</text></g>`;
  });
  return `<svg viewBox="-130 -136 260 266" role="img" aria-label="Колесо фортуни">
    <circle r="124" fill="var(--floor2)"/>
    <g id="wheelRot" style="transform:rotate(${wheelRot}deg)">${segs}
      ${Array.from({length:WHEEL.length},(_,i)=>{const [x,y]=pt(i*step,121);return `<circle cx="${x}" cy="${y}" r="2.6" fill="#F7C948"/>`}).join('')}
    </g>
    <circle r="22" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
    <svg x="-17" y="-18" width="34" height="34" viewBox="0 0 100 100">${animalInner({coat:SP().start},'wheelhub')}</svg>
    <path d="M-11 -134L11 -134L0 -110Z" fill="var(--rose)" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>
  </svg>`;
}
function viewWheel(){
  const total = WHEEL.reduce((a,s)=>a+s.w,0);
  const full = occupied() >= capacity();
  const free = freeSpin();
  const left = Math.max(1, PITY - S.wheel.sinceLegend);
  const catOdds = [0,1,2,3,4,5].map(r=>WHEEL.filter(s=>s.k==='cat'&&s.v===r).reduce((a,s)=>a+s.w,0)/total*100);
  const pct = v => v>=1 ? v.toFixed(0)+'%' : v.toFixed(1)+'%';
  return `<div class="section"><h2>Колесо фортуни</h2><div class="card wheelcard">
    <div class="wheelbox" id="wheelBox">${wheelSVG()}</div>
    <div class="wheelside">
      <p class="small muted" style="margin:0">Крути колесо й вигравай монетки, корм або нових котиків. Легендарні й міфічні котики трапляються лише тут.</p>
      <div class="odds">
        ${[0,1,2,3,4,5].map(r=>`<span>${r?`<span class="rar r${r}">${RAR_NAMES[r]}</span>`:RAR_NAMES[r]+' котик'} · ×${RAR_MULT[r]}</span><b>${pct(catOdds[r])}</b>`).join('')}
        <span class="muted">Монетки, корм, досвід</span><b class="muted">${pct(100-catOdds.reduce((a,b)=>a+b,0))}</b>
      </div>
      <p class="small" style="margin:0">Легендарний або кращий котик гарантовано не пізніше ніж за <b>${left}</b> ${left===1?'обертання':left<5?'обертання':'обертань'}.</p>
      ${S.wheel.bonus>0?`<p class="small" style="margin:0">Бонусних обертань: <b>${S.wheel.bonus}</b></p>`:''}
      <div class="btns">${full
        ? `<span class="rar">Немає вільного місця для нового котика</span>`
        : free
          ? `<button class="btn primary" data-act="spin" id="spinBtn" ${spinning?'disabled':''}>${S.wheel.freeDay!==todayStr()?'Безкоштовне обертання':'Бонусне обертання'}</button>`
          : `<button class="btn primary" data-act="spin" id="spinBtn" data-cost="${SPIN_COST}" ${spinning?'disabled':''}>${ICON.coin} ${SPIN_COST} · Крутити</button>`}</div>
      ${!free && !full ? '<p class="small muted" style="margin:0">Безкоштовне обертання знову буде завтра.</p>' : ''}
    </div></div></div>`;
}
function pickSegment(){
  if (S.wheel.sinceLegend >= PITY-1) return WHEEL.findIndex(s=>s.k==='cat'&&s.v===4);
  const total = WHEEL.reduce((a,s)=>a+s.w,0);
  let x = Math.random()*total;
  for (let i=0;i<WHEEL.length;i++){ x -= WHEEL[i].w; if (x<=0) return i; }
  return 0;
}
function spinWheel(){
  if (spinning) return;
  if (occupied() >= capacity()){ toast('Спершу звільни місце: можливо, випаде котик'); return; }
  const free = freeSpin();
  if (!free && S.coins < SPIN_COST) return;
  if (S.wheel.freeDay !== todayStr()) S.wheel.freeDay = todayStr();
  else if ((S.wheel.bonus||0) > 0) S.wheel.bonus--;
  else S.coins -= SPIN_COST;
  const i = pickSegment(), seg = WHEEL[i];
  S.wheel.spins++;
  S.wheel.sinceLegend = (seg.k==='cat' && seg.v>=4) ? 0 : S.wheel.sinceLegend + 1;
  task('spin');
  // приз записується одразу, щоб не загубився, якщо сторінку закриють під час обертання
  let prize = null;
  if (seg.k==='coins'){ S.coins += seg.v; S.stats.coinsEarned += seg.v; }
  else if (seg.k==='food') S.food += seg.v;
  else if (seg.k==='xp') gainXp(seg.v);
  else {
    const pool = rollPool(S.sp, seg.v);
    prize = {id:S.uid++, coat:rnd(pool)};
    S.wheel.pending = prize;
  }
  touch(true);
  spinning = true;
  const btn = document.getElementById('spinBtn'); if (btn) btn.disabled = true;
  const step = 360/WHEEL.length;
  const center = i*step + step/2 + (Math.random()-0.5)*step*0.6;
  const base = wheelRot - (wheelRot % 360) + 360*6;
  wheelRot = base + (360 - center);
  const g = document.getElementById('wheelRot');
  if (g) requestAnimationFrame(()=>{ g.style.transform = `rotate(${wheelRot}deg)`; });
  const ticks = setInterval(()=>{ if (canPlay()) tickSound(); }, 160);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{
    clearInterval(ticks);
    spinning = false;
    if (seg.k==='cat'){
      meowSound(seg.v>=4?1.2:1, 'long');
      openNaming(prize, true);
    } else {
      note(seg.k==='coins' ? `Виграш: ${seg.v} монеток!` : seg.k==='food' ? `Виграш: ${seg.v} порцій корму!` : `Виграш: ${seg.v} досвіду!`);
    }
    renderTop();
    if (tab==='shop') renderTab(true);
    pendingRender = false;
  }, reduce ? 700 : SPIN_MS);
}
function tickSound(){
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'triangle'; o.frequency.value = 1400;
  g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.04);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.05);
}

async function sendChat(raw){

        onText:({text})=>{ if (bub){ bub.classList.remove('typing'); bub.textContent = text; bub.parentNode && (bub.parentNode.scrollTop = bub.parentNode.scrollHeight); } }});

function db(){

function randHex(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function newIdentity(me){ me.player.id = crypto.randomUUID ? crypto.randomUUID() : [randHex(4),randHex(2),'4'+randHex(2).slice(1),'8'+randHex(2).slice(1),randHex(6)].join('-'); me.player.secret = randHex(24); }
function houseOf(me){
  return { name: me.name, rooms: me.rooms, upgrades: me.upgrades, sp: me.sp || 'cat',
    cats: me.cats.slice(0, 60).map(c => ({name:c.name, coat:c.coat, trait:c.trait, lvl:c.lvl, kitten:!!c.kitten, wear:c.wear, room:c.room, happy:Math.round(c.happy), hunger:Math.round(c.hunger)})) };
}
async function pushProfile(force){
  const me = W;
  if (!me || !netReady() || !me.player.nick || pushing || lb.conflict) return;
  if (document.hidden) return;
  if (!force && now() - lastPush < 60000) return;
  if (!me.player.id || !me.player.secret) newIdentity(me);
  pushing = true; lastPush = now();
  try {
    const coins = Math.floor(me.coins), hs = ownedSp().map(sp => me.houses[sp]);
    const collection = hs.reduce((a, h) => a + coatsOf(h.sp).filter(k => h.seenCoats[k]).length, 0);
    const pets = hs.reduce((a, h) => a + h.cats.length, 0);
    let lvl = 1; while (me.houses.cat.xp >= xpNeed(lvl)) lvl++;
    const house = Object.assign(houseOf(me.houses.cat), {others: Object.fromEntries(hs.filter(h => h.sp!=='cat').map(h => [h.sp, houseOf(h)]))});
    const { error } = await db().rpc('save_player', { p_id: me.player.id, p_secret: me.player.secret, p_nickname: me.player.nick,
      p_coins: coins, p_cats: pets, p_collection: collection, p_level: lvl, p_house: house });
    if (error) throw error;
  } catch(e){
    console.warn('профіль:', e);
    if (/not your player/i.test(e.message||'')){ lb.conflict = true; if (tab==='players') renderTab(); }
  } finally { pushing = false; }
}

  if (sec < 86400) return `у мережі ${Math.round(sec/3600)} год тому`;

         <label class="selrow" for="tWrar">Рідкість: <select id="tWrar">${RAR_NAMES.map((n, r) => `<option value="${r}" ${f.wrar===r?'selected':''}>${n}</option>`).join('')}</select></label>`}

  if (mine.length) h += `<div class="section"><h2>Мої пропозиції</h2><div class="grid">${mine.map(tradeCard).join('')}</div></div>`;

  else if (!market.length) h += `<div class="card"><p class="muted" style="margin:0">Поки ніхто нічого не виставив. Будь першим!</p></div>`;
  else h += `<div class="grid">${market.map(tradeCard).join('')}</div>`;
  return h + `</div>`;
}

function buildVisitState(p, sp){
  sp = sp || 'cat';
  const top = (p && typeof p.house==='object' && p.house) || {};
  const h = sp==='cat' ? top : ((top.others && typeof top.others==='object' && top.others[sp]) || {});
  const st = defaults(sp);
  st.name = String(h.name || 'Притулок').slice(0, 40);
  for (const r of ['yard','lounge','cafe']) st.rooms[r] = !!(h.rooms && h.rooms[r]);
  for (const k in st.upgrades) st.upgrades[k] = clamp(Math.floor(+((h.upgrades||{})[k]) || 0), 0, 10);
  const slotOk = (slot, v) => (ITEMS[v] && ITEMS[v].slot===slot) ? v : '';
  st.cats = (Array.isArray(h.cats) ? h.cats : []).slice(0, 60).filter(c => c && COATS[c.coat] && COATS[c.coat].sp===sp).map((c, i) => {
    const x = catDefaults();
    x.id = i + 1; x.name = String(c.name || 'Котик').slice(0, 24); x.coat = c.coat;
    x.trait = TRAITS.includes(c.trait) ? c.trait : TRAITS[0];
    x.lvl = clamp(Math.floor(+c.lvl || 1), 1, CAT_MAX_LVL); x.kitten = !!c.kitten;
    x.room = ['yard','lounge','cafe'].includes(c.room) && st.rooms[c.room] ? c.room : 'main';
    const w = c.wear || {}; x.wear = {head:slotOk('head', w.head), face:slotOk('face', w.face), neck:slotOk('neck', w.neck)};
    x.happy = clamp(+c.happy || 70, 0, 100); x.hunger = clamp(+c.hunger || 80, 0, 100);
    return x;
  });
  st.uid = st.cats.length + 1; st.settings = Object.assign({}, S.settings); st.curRoom = 'main'; st.lastTick = now();
  st.cats.forEach(c => { st.seenCoats[c.coat] = true; });
  return st;
}

/* ---------------- акаунт і синхронізація між пристроями ----------------
   Необов’язково: без входу гра зберігається лише в браузері. Після входу
   той самий притулок відкривається на будь-якому пристрої. */
const acct = {user:null, busy:false, syncedAt:0, picking:false, lastEmail:'', cloudAt:0, sentAt:0};
const AUTH_ERR = [
  [/invalid login credentials/i, 'Неправильний email або пароль.'],
  [/already registered|already been registered|already exists/i, 'Такий email уже зареєстровано. Спробуй увійти.'],
  [/not confirmed/i, 'Спершу підтверди email: відкрий лист і натисни посилання.'],
  [/password.*(6|short|least)/i, 'Пароль має бути щонайменше 6 символів.'],
  [/rate|too many|security purposes/i, 'Забагато спроб. Зачекай хвилину й спробуй ще раз.'],
  [/invalid.*email|email.*invalid/i, 'Перевір, чи правильно введено email.'],
  [/fetch|network/i, 'Немає з’єднання із сервером. Перевір інтернет.']
];
const authErr = e => { const m = (e && (e.message || e.error_description)) || String(e); const hit = AUTH_ERR.find(([re]) => re.test(m)); return hit ? hit[1] : 'Не вийшло: ' + m; };
const hasProgress = w => !!w && !!w.houses && (Object.keys(w.houses).length > 1 || Object.values(w.houses).some(st => (st.stats && st.stats.rescued > 0) || (st.xp||0) >= 50 || (st.cats||[]).length > 1));
function makeCloudDoc(uid){
  return { set: async ({state, savedAt, version}) => {
    // якщо інший пристрій уже записав новіший прогрес, не перезаписуємо його, а підтягуємо
    const cur = await db().from('saves').select('saved_at').eq('user_id', uid).maybeSingle();
    if (cur.error) throw cur.error;
    const known = Math.max(acct.cloudAt, acct.sentAt);
    if (cur.data && Date.parse(cur.data.saved_at) > known + 1000){
      const cloud = await fetchCloud();
      if (cloud){ acct.cloudAt = cloud.savedAt || Date.parse(cur.data.saved_at); adoptState(cloud); toast('Завантажено новіший прогрес з іншого пристрою'); return; }
    }
    acct.sentAt = Math.max(acct.sentAt, savedAt);
    const { error } = await db().from('saves').upsert({ user_id:uid, state, saved_at:new Date(savedAt).toISOString(), version }, { onConflict:'user_id' });
    if (error) throw error;
    acct.cloudAt = Math.max(acct.cloudAt, savedAt); acct.syncedAt = now();
  } };
}
async function fetchCloud(){
  const { data, error } = await db().from('saves').select('state').eq('user_id', acct.user.id).maybeSingle();
  if (error) throw error;
  if (!data || !data.state) return null;
  try { return migrate(JSON.parse(data.state)); } catch(e){ return null; }
}
function adoptState(st){
  if (visiting) endVisit();
  closeSheets();
  if (laser.on) setLaser(false);
  setWorld(st);
  catchUp();
  brains.clear(); lifeMounted = false; reset3DCats();
  lastLevel = level(); shownCoins = null;
  renderAll(); applyTheme(); renderSoundBtn(); renderBell();
  saveLocal();
}
async function accountInit(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  setSaveStatus('device');
  const sb = db();
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev==='PASSWORD_RECOVERY'){ setTimeout(() => showAuth('newpass'), 0); return; }
    if (ev==='SIGNED_IN' && session && (!acct.user || acct.user.id !== session.user.id)) setTimeout(() => onSignedIn(session.user), 0);
    if (ev==='SIGNED_OUT'){ acct.user = null; cloudDoc = null; setSaveStatus('device'); renderAccount(); }
  });
  try {
    const { data } = await sb.auth.getSession();
    if (data.session && !/type=recovery/.test(location.hash)) await onSignedIn(data.session.user);
  } catch(e){ console.warn(e); }
  renderAccount();
}
async function onSignedIn(user){
  if (acct.busy || (acct.user && acct.user.id===user.id && cloudDoc)) return;
  acct.busy = true; acct.user = user; acct.lastEmail = user.email || acct.lastEmail;
  closeAuth();
  try {
    const cloud = await fetchCloud();
    const mine = W;
    const link = async () => { cloudDoc = makeCloudDoc(user.id); await saveCloud(); };
    if (cloud) acct.cloudAt = cloud.savedAt || 0;
    if (!cloud){ await link(); note('Прогрес прив’язано до акаунта. Тепер він синхронізується на всіх твоїх пристроях'); }
    else if (cloud.createdAt === mine.createdAt){ if ((cloud.savedAt||0) > (mine.savedAt||0)) adoptState(cloud); else acct.cloudAt = 0; await link(); toast('Прогрес синхронізовано'); }
    else if (!hasProgress(mine)){ adoptState(cloud); cloudDoc = makeCloudDoc(user.id); toast('Завантажено твій притулок з акаунта'); }
    else if (!hasProgress(cloud)){ acct.cloudAt = 0; await link(); toast('Прогрес прив’язано до акаунта'); }
    else pickSave(cloud, mine, user.id);
  } catch(e){ console.warn(e); toast('Не вдалося зв’язатися з акаунтом. Гра поки зберігається в цьому браузері'); }
  acct.busy = false; setSaveStatus(cloudDoc ? 'cloud' : 'device'); renderAccount();
}
function saveSummary(w){
  const hs = Object.values(w.houses||{}), cat = (w.houses||{}).cat || {};
  let l = 1; while ((cat.xp||0) >= xpNeed(l)) l++;
  const pets = hs.reduce((a,h) => a + (h.cats||[]).length, 0), saved = hs.reduce((a,h) => a + ((h.stats||{}).rescued||0), 0);
  return `<div class="statlist small"><span>Рівень котячого притулку</span><b>${l}</b><span>Будинків</span><b>${hs.length}</b><span>Золото</span><b>${Math.floor(w.coins||0).toLocaleString('uk-UA')}</b><span>Улюбленців</span><b>${pets}</b><span>Врятовано</span><b>${saved}</b></div>
    <span class="small muted">Збережено: ${w.savedAt ? logAgo(w.savedAt) : 'невідомо'}</span>`;
}
function pickSave(cloud, mine, uid){
  acct.picking = true;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pkTitle" style="max-width:520px">

    <p class="small muted" style="margin:0">В акаунті вже є інший притулок. Вибери, який прогрес продовжити на всіх пристроях. Інший буде замінено.</p>
    <div class="pickgrid">
      <div class="card"><b>З акаунта</b>${saveSummary(cloud)}<button class="btn primary" type="button" id="pkCloud">Залишити цей</button></div>
      <div class="card"><b>З цього пристрою</b>${saveSummary(mine)}<button class="btn primary" type="button" id="pkLocal">Залишити цей</button></div>
    </div></div></div>`;
  document.getElementById('pkCloud').onclick = () => { root.innerHTML = ''; acct.picking = false; acct.cloudAt = cloud.savedAt || 0; adoptState(cloud); cloudDoc = makeCloudDoc(uid); setSaveStatus('cloud'); renderAccount(); toast('Завантажено притулок з акаунта'); };
  document.getElementById('pkLocal').onclick = async () => { root.innerHTML = ''; acct.picking = false; acct.cloudAt = Date.now(); cloudDoc = makeCloudDoc(uid); await saveCloud(); setSaveStatus('cloud'); renderAccount(); toast('Притулок з цього пристрою збережено в акаунті'); };
}
async function syncCheck(){
  if (!acct.user || !cloudDoc || acct.busy || acct.picking || visiting) return;
  try {
    const cloud = await fetchCloud();
    if (cloud && (cloud.savedAt||0) > Math.max(acct.cloudAt, acct.sentAt) + 1000){ acct.cloudAt = cloud.savedAt; adoptState(cloud); toast('Завантажено новіший прогрес з іншого пристрою'); }
  } catch(e){}
}
async function signOut(){

function closeAuth(){ const r = document.getElementById('modalRoot'); if (r.querySelector('.authmodal')) r.innerHTML = ''; }
function showAuth(mode, msg, isErr){

  let body;

      <input type="email" id="auEmail" autocomplete="email" required value="${esc(acct.lastEmail)}"><button class="btn primary" type="submit">Надіслати лист</button></form><button class="linkbtn" type="button" id="auBack">Назад до входу</button>`;

      ${msgHtml}<form class="authform" id="auForm">
        <label for="auEmail" class="small muted">Email</label><input type="email" id="auEmail" autocomplete="email" required value="${esc(acct.lastEmail)}">
        <label for="auPass" class="small muted">Пароль${up?' (щонайменше 6 символів)':''}</label><input type="password" id="auPass" autocomplete="${up?'new-password':'current-password'}" minlength="6" required>
        <button class="btn primary" type="submit" id="auSubmit">${up ? 'Створити акаунт' : 'Увійти'}</button></form>
      ${up ? '<p class="small muted" style="margin:0">Твій нинішній притулок одразу прив’яжеться до нового акаунта.</p>' : '<button class="linkbtn" type="button" id="auForgot">Забули пароль?</button>'}`; }
  root.innerHTML = `<div class="overlay" id="auOverlay"><div class="modal authmodal" role="dialog" aria-modal="true">${body}

  document.getElementById('auClose').onclick = () => { root.innerHTML = ''; };

  setTimeout(() => (document.getElementById(acct.lastEmail && mode!=='forgot' ? 'auPass' : 'auEmail') || document.getElementById('auPass'))?.focus(), 30);

        if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) return showAuth('login', 'Такий email уже зареєстровано. Спробуй увійти.', true);
        if (data.session) await onSignedIn(data.session.user);
        else showAuth('sent', `Ми надіслали лист на <b>${esc(email)}</b>. Відкрий його й натисни посилання, щоб підтвердити акаунт, а потім увійди тут.`);
      } else {
        const { data, error } = await db().auth.signInWithPassword({ email, password: pass }); if (error) throw error;
        await onSignedIn(data.user || data.session.user);
      }
    } catch(err){ showAuth(mode==='newpass'||mode==='forgot'||mode==='signup' ? mode : 'login', authErr(err), true); }
  };
}

function chestRoll(){
  const owned = Object.keys(ITEMS).filter(k => ITEMS[k].chest && !S.wardrobe[k]);
  const space = occupied() < capacity();
  const lvl10 = S.cats.filter(c => (c.lvl||1) >= CAT_MAX_LVL && (c.stars||0) < STAR_MAX);
  const table = [[12,'shards'],[30,'coins'],[18,'food'],[14,'tokens'],[14, owned.length?'item':'coins'],[12, space?'cat':'coins'],[5, space?'legend':'coins'],[7, lvl10.length?'star':'coins']];
  let x = Math.random()*table.reduce((a,t)=>a+t[0],0);
  for (const [w, kind] of table){ x -= w; if (x <= 0) return {kind, owned, lvl10}; }
  return {kind:'coins', owned, lvl10};
}

  else { const rar = r.kind==='legend' ? 4 : (Math.random()<.5 ? 2 : 3); const coat = rnd(rollPool(S.sp, rar));

    title = `${RAR_NAMES[rar]} котик ${c.name}`; text = `${COATS[coat].n}. Він уже в притулку.`; pic = catSVG(c, 'chc'+c.id, 'big'); }
  logEvent(`Скриня: ${title}`); gainXp(5); touch(true); renderTop(); renderScene();
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="chOverlay"><div class="modal chestmodal" role="dialog" aria-modal="true" aria-labelledby="chTitle">

function openGroom(id){
  const c = catById(id); if (!c) return;
  if (isShiny(c)){ toast(`Шерсть котика ${c.name} ще блищить`); return; }
  const root = document.getElementById('modalRoot');
  const r = seededRand(c.id + now());
  const tufts = [];
  while (tufts.length < 14){
    const head = tufts.length < 4;
    const a = r()*Math.PI*2, d = Math.sqrt(r());
    const x = head ? 50 + Math.cos(a)*d*14 : 50 + Math.cos(a)*d*20, y = head ? 40 + Math.sin(a)*d*12 : 72 + Math.sin(a)*d*16;
    tufts.push({x, y, rot: r()*360});
  }
  const fur = S.sp==='fish' ? '#6FAE5A' : S.sp==='rat' ? '#DDEFFA' : COATS[c.coat].base;
  root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <h2 id="gTitle">Вичісування: ${esc(c.name)}</h2>
    <p class="small muted" style="margin:0">Проведи пальцем або мишкою по клубочках шерсті, щоб їх вичесати.</p>
    <div class="groombox" id="groomBox">${catSVG(c, 'gr'+c.id)}
      <svg viewBox="0 0 100 100" id="tuftLayer">${tufts.map((t,i)=>`<g class="tuft" data-t="${i}" transform="translate(${t.x.toFixed(1)} ${t.y.toFixed(1)}) rotate(${t.rot.toFixed(0)})"><g fill="${fur}" stroke="var(--catline)" stroke-width=".6"><circle r="3.2" cx="-2"/><circle r="3" cx="2" cy="-1"/><circle r="2.6" cx="0" cy="2"/></g><path d="M-3 -1q3 -2 6 0M-2 1.5q2 -1.5 4 0" stroke="var(--catline)" stroke-width=".5" fill="none" opacity=".6"/></g>`).join('')}
        <g id="comb" opacity="0"><rect x="-7" y="-3" width="14" height="4" rx="1.5" fill="#C98BA0"/><g stroke="#C98BA0" stroke-width="1">${Array.from({length:7},(_,i)=>`<line x1="${-6+i*2}" y1="1" x2="${-6+i*2}" y2="6"/>`).join('')}</g></g></svg>
    </div>
    <b id="groomLeft">Залишилось: ${tufts.length}</b>
    <div class="btns" style="justify-content:center"><button class="btn" type="button" id="gClose">Закрити</button></div>
  </div></div>`;
  const box = document.getElementById('groomBox'), layer = document.getElementById('tuftLayer'), comb = document.getElementById('comb');
  let left = tufts.length, down = false, finished = false;
  const toLocal = e => { const pt = layer.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(layer.getScreenCTM().inverse()); };
  const brush = e => {
    const p = toLocal(e);
    comb.setAttribute('opacity', '1'); comb.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(-20)`);
    if (!down && e.pointerType!=='mouse') return;
    if (!down && e.pointerType==='mouse' && !e.buttons) return;
    tufts.forEach((t, i) => {
      if (t.gone || Math.hypot(t.x-p.x, t.y-p.y) > 7) return;
      t.gone = true; left--;
      layer.querySelector(`[data-t="${i}"]`).classList.add('gone');
      if (canPlay()) tickSound();
    });
    document.getElementById('groomLeft').textContent = left ? `Залишилось: ${left}` : 'Готово! Шерсть блищить';
    if (!left && !finished){
      finished = true;
      c.shinyUntil = now() + 2*3600000; c.happy = clamp(c.happy+15, 0, 100); S.stats.groomed++; gainXp(4); task('groom');
      const b = brains.get(c.id); if (b){ purrSound(b.pitch); say(b, 'Мурррр'); }
      touch(true);
      setTimeout(() => { root.innerHTML = ''; renderScene(); renderTab(); toast(`${c.name} сяє! Дві години він приносить на 25% більше монеток`); }, 1100);
    }
  };
  box.addEventListener('pointerdown', e => { down = true; try { box.setPointerCapture(e.pointerId); } catch(_){} brush(e); });
  box.addEventListener('pointermove', brush);
  box.addEventListener('pointerup', () => { down = false; });
  box.addEventListener('pointercancel', () => { down = false; });
  document.getElementById('gClose').onclick = () => { root.innerHTML = ''; };
}
function seededRand(n){ let h = (n|0) ^ 0x9e3779b9; return () => { h ^= h<<13; h ^= h>>>17; h ^= h<<5; return ((h>>>0)%10000)/10000; }; }

function logAgo(ts){

  if (s < 60) return 'щойно';
  if (s < 3600) return `${Math.floor(s/60)} хв тому`;
  const d = new Date(ts), td = new Date();
  const hm = d.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
  return d.toDateString()===td.toDateString() ? `сьогодні ${hm}` : `${d.toLocaleDateString('uk-UA', {day:'numeric', month:'short'})} ${hm}`;
}
