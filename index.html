/* ================= Пригоди: експедиції, злиття, уламки, секрети, серія входів ================= */
const hasSpace = () => occupied() < capacity();
const SHARD_NEED = [20, 30, 50, 70, 100, 150, 250];
function addShards(coat, n){ if (!COATS[coat] || n <= 0) return; W.shards[coat] = (W.shards[coat]||0) + n; }
/* випадкове забарвлення за вагами рідкості */
function rollRar(w){ let x = Math.random()*w.reduce((a,b)=>a+b,0); for (let r = 0; r < w.length; r++){ x -= w[r]; if (x <= 0) return r; } return 0; }
function rndCoat(sp, r){ let p = rollPool(sp, r); while (!p.length && r > 0) p = rollPool(sp, --r); return rnd(p); }
function giveRandomShards(n, w){
  const got = {};
  let parts = n > 10 ? 3 : n > 4 ? 2 : 1;
  for (let i = 0; i < parts; i++){ const k = rndCoat(S.sp, rollRar(w)), q = i < parts-1 ? Math.round(n/parts) : n - Math.round(n/parts)*(parts-1); if (q > 0){ addShards(k, q); got[k] = (got[k]||0) + q; } }
  return got;
}
const shardText = got => Object.entries(got).map(([k, n]) => `${n} уламків «${COATS[k].n}»`).join(', ');

/* новий улюбленець одразу в притулку, з можливістю дати ім’я */
function giftAnimal(coat, why, o){
  o = o || {};
  const k = COATS[coat], c = makeCat(S, coat);
  c.hunger = 85; c.happy = 85; c.story = o.story || 'wheel'; c.lvl = clamp(o.lvl || 1, 1, CAT_MAX_LVL); c.room = placeRoom(); ensurePerks(c);
  S.cats.push(c); const isNew = !S.seenCoats[coat]; S.seenCoats[coat] = true; gainXp(10);
  logEvent(`${why}: ${k.n} (${RAR_NAMES[k.rar].toLowerCase()}) — ${c.name}`);
  touch(true); renderTop(); renderScene(); if (!o.quiet) renderTab();
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal giftmodal ${k.rar>=6?'divine':''}" role="dialog" aria-modal="true" aria-labelledby="gfTitle">
    ${catSVG(c, 'gf'+c.id, 'big')}
    <h2 id="gfTitle">${o.title || (k.secret ? 'Секретний улюбленець!' : k.rar>=6 ? 'Божественний улюбленець!' : 'Новий друг!')}</h2>
    <p class="small muted" style="margin:0">${esc(why)}. ${k.n}${isNew ? ' — нове забарвлення в колекції!' : ''}</p>
    <span class="rar r${k.rar}">${RAR_NAMES[k.rar]} · дохід ×${RAR_MULT[k.rar]}</span>
    ${o.note ? `<p class="small" style="margin:0">${o.note}</p>` : ''}
    <div class="field" style="width:100%"><label for="gfName" class="small muted">Як його назвемо?</label><input type="text" id="gfName" maxlength="24" value="${esc(c.name)}"></div>
    <div class="btns" style="justify-content:center"><button class="btn primary" type="button" id="gfOk">У притулок</button></div></div></div>`;
  const inp = document.getElementById('gfName');
  document.getElementById('gfOk').onclick = () => { const n = inp.value.trim(); if (n) c.name = n.slice(0, 24); root.innerHTML = ''; touch(true); renderScene(); renderTab(); };
  if (canPlay()) meowSound(k.rar>=5 ? 1.2 : 1, 'long');
  return c;
}

/* ---------- секретні улюбленці ---------- */
const isNight = () => { const h = new Date().getHours(); return h >= 0 && h < 5; };
const secretCoat = kind => coatsOf(S.sp).find(k => COATS[k].secret===kind);
function trySecret(kind){
  const coat = secretCoat(kind); if (!coat || S.seenCoats[coat]) return false;
  if (!hasSpace()){ toast('Секретний гість хотів прийти, але в притулку немає місця. Звільни місце!'); return false; }
  const why = {mini:`Рекорд у грі «${MINI_().t}» привів незвичайного гостя`, talk:'Після стількох розмов прийшов дуже мудрий гість', night:'Нічна прогулянка привела загадкового гостя'}[kind];
  giftAnimal(coat, why, {story:'wheel', note:'Секретні улюбленці не трапляються в колесі, скринях чи злитті.'});
  return true;
}

/* ---------- експедиції ---------- */
const EXP_KINDS = [
  {k:'s', ms:30*60000,   coins:[200,500],   sh:[2,5],   pet:.10, xp:10, w:[40,35,20,5,0,0,0]},
  {k:'m', ms:2*3600000,  coins:[700,1600],  sh:[5,12],  pet:.20, xp:25, w:[8,30,32,22,6,2,0]},
  {k:'l', ms:8*3600000,  coins:[2200,5000], sh:[12,28], pet:.35, xp:60, w:[0,8,24,32,22,10,4]}
];
const EXP_N = {cat:['Прогулянка дахами','Подорож до старого маяка','Експедиція в Зачарований ліс'], dog:['Прогулянка парком','Похід у гори','Експедиція до Північного сяйва'],
  rat:['Розвідка комори','Мандрівка підземними тунелями','Експедиція в Сирні печери'], fish:['Запливи до рифу','Подорож річкою до моря','Експедиція в Глибоке море']};
const expName = (kind, sp) => EXP_N[sp || S.sp][EXP_KINDS.findIndex(e => e.k===kind)];
const EXP_SLOTS = 2;
const expUI = {kind:'s', team:[]};
const canTravel = c => !c.away && !c.treatUntil && !c.kitten && !(c.sick);
const teamPower = ids => ids.map(catById).filter(Boolean).reduce((a, c) => a + (1 + COATS[c.coat].rar) * (1 + .1*((c.lvl||1)-1)) * (1 + .15*(c.stars||0)), 0);
const powerMult = p => Math.min(3.5, 1 + p/25);
const fmtDur = ms => { const m = Math.max(0, Math.ceil(ms/60000)); return m >= 60 ? `${Math.floor(m/60)} год${m%60 ? ' ' + (m%60) + ' хв' : ''}` : `${m} хв`; };
function expOdds(kind, ids){
  const E = EXP_KINDS.find(e => e.k===kind), pm = powerMult(teamPower(ids));
  const w = E.w.map((x, r) => x * (r >= 3 ? Math.pow(pm, (r-2)*.6) : 1)), tot = w.reduce((a,b)=>a+b,0);
  return {pet: Math.min(.9, E.pet * Math.min(2, .6 + pm*.4)), w, best: w.map(x => x/tot), pm};
}
function startExp(){
  const ids = expUI.team.filter(id => { const c = catById(id); return c && canTravel(c); });
  if (!ids.length){ toast('Вибери від 1 до 3 улюбленців у команду'); return; }
  if (S.exp.length >= EXP_SLOTS){ toast('Усі команди вже в дорозі'); return; }
  const E = EXP_KINDS.find(e => e.k===expUI.kind), end = now() + E.ms;
  ids.forEach(id => { const c = catById(id); c.away = end; });
  S.exp.push({id:S.uid++, kind:E.k, team:ids, endsAt:end, start:now()});
  expUI.team = [];
  toast(`Команда вирушила: ${expName(E.k)}. Повернеться за ${fmtDur(E.ms)}`);
  touch(true); renderScene(); renderTab();
}
function collectExp(id){
  const e = S.exp.find(x => x.id===id); if (!e || now() < e.endsAt) return;
  const E = EXP_KINDS.find(x => x.k===e.kind), o = expOdds(e.kind, e.team);
  const lvlM = 1 + .06*(level()-1);
  const coins = Math.round(rand(...E.coins) * o.pm * lvlM * (1 + profSum('scout')));
  W.coins += coins; S.stats.coinsEarned += coins;
  const got = giveRandomShards(Math.round(rand(...E.sh) * Math.min(2.2, o.pm) * (1 + profSum('scout'))), E.w.map((x, r) => r >= 6 ? x*.5 : x));
  e.team.forEach(tid => { const c = catById(tid); if (c){ c.away = 0; c.happy = clamp(c.happy+12, 0, 100); c.hunger = clamp(c.hunger-25, 0, 100); } });
  S.exp = S.exp.filter(x => x !== e); S.stats.expeditions = (S.stats.expeditions||0) + 1; gainXp(E.xp); task('exp');
  let pet = null;
  if (Math.random() < o.pet){
    const r = rollRar(o.w), coat = rndCoat(S.sp, r);
    if (hasSpace()) pet = coat; else { addShards(coat, Math.ceil(SHARD_NEED[COATS[coat].rar]/2)); got[coat] = (got[coat]||0) + Math.ceil(SHARD_NEED[COATS[coat].rar]/2); }
  }
  logEvent(`${expName(e.kind)}: +${coins} монеток${Object.keys(got).length ? ', ' + shardText(got) : ''}`);
  touch(true); renderTop(); renderScene();
  if (pet){ giftAnimal(pet, `Знахідка в поході «${expName(e.kind)}»`, {note:`А ще команда принесла ${coins.toLocaleString('uk-UA')} монеток${Object.keys(got).length ? ' і ' + shardText(got) : ''}.`}); return; }
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <div class="teamrow">${e.team.map(tid => catById(tid)).filter(Boolean).map(c => catSVG(c, 'ex'+c.id)).join('')}</div>
    <h2 id="exTitle">Команда повернулася!</h2><p class="small muted" style="margin:0">${expName(e.kind)}</p>
    <div class="statlist small" style="width:100%"><span>Монетки</span><b>+${coins.toLocaleString('uk-UA')}</b>${Object.entries(got).map(([k,n]) => `<span>Уламки «${COATS[k].n}»</span><b>+${n}</b>`).join('')}</div>
    <div class="btns" style="justify-content:center"><button class="btn primary" type="button" id="exOk">Чудово</button></div></div></div>`;
  document.getElementById('exOk').onclick = () => { root.innerHTML = ''; renderTab(); };
  renderTab();
}

/* ---------- злиття ---------- */
const mergeUI = {r:-1, sel:[], arm:0};
const canMerge = c => !c.away && !c.treatUntil && !COATS[c.coat].secret && COATS[c.coat].rar < 6 && !c.borrowed;
function doMerge(){
  const cs = mergeUI.sel.map(catById).filter(c => c && canMerge(c));
  if (cs.length !== 3 || new Set(cs.map(c => COATS[c.coat].rar)).size !== 1) return;
  const r = COATS[cs[0].coat].rar, lvl = Math.floor(cs.reduce((a, c) => a + (c.lvl||1), 0) / 3);
  const ids = new Set(cs.map(c => c.id));
  S.cats = S.cats.filter(c => !ids.has(c.id)); task('merge');
  mergeUI.sel = []; mergeUI.arm = 0; S.stats.merged = (S.stats.merged||0) + 1;
  const coat = rndCoat(S.sp, r+1);
  giftAnimal(coat, `Злиття трьох: ${RAR_NAMES[r].toLowerCase()} → ${RAR_NAMES[r+1].toLowerCase()}`, {lvl, title: r+1 >= 6 ? 'Божественне злиття!' : 'Злиття вдалося!', note:`Новий улюбленець отримав середній рівень трьох: ${lvl}.`});
}

/* ---------- уламки ---------- */
function craftShard(coat){
  const k = COATS[coat]; if (!k || k.sp !== S.sp || k.secret) return;
  const need = SHARD_NEED[k.rar];
  if ((W.shards[coat]||0) < need) return;
  if (!hasSpace()){ toast('У притулку немає вільного місця'); return; }
  W.shards[coat] -= need; if (!W.shards[coat]) delete W.shards[coat];
  S.stats.crafted = (S.stats.crafted||0) + 1;
  giftAnimal(coat, 'Зібрано з уламків');
}

/* ---------- серія щоденних входів ---------- */
const STREAK = [
  {t:'300 монеток'}, {t:'20 корму і 400 монеток'}, {t:'3 жетони перекидання'}, {t:'1 000 монеток'},
  {t:'15 уламків'}, {t:'Подарункова скриня'}, {t:'Епічний улюбленець'}
];
const yesterdayStr = () => new Date(Date.now() - 864e5).toDateString();
const streakDue = () => W && W.streak.day !== todayStr();
function streakNext(){ return W.streak.day === yesterdayStr() ? W.streak.n + 1 : 1; }
function showStreak(){
  if (!streakDue() || visiting) return;
  const root = document.getElementById('modalRoot'); if (root.firstElementChild) return;
  const n = streakNext(), i = (n-1) % 7, toMyth = 30 - ((n-1) % 30) - 1;
  root.innerHTML = `<div class="overlay"><div class="modal streakmodal" role="dialog" aria-modal="true" aria-labelledby="stTitle">
    <h2 id="stTitle">${n===1 ? 'Ласкаво просимо назад!' : `${n}-й день поспіль!`}</h2>
    <p class="small muted" style="margin:0">Заходь щодня й забирай подарунки. Пропустиш день — серія почнеться спочатку.</p>
    <div class="streak">${STREAK.map((d, j) => `<div class="sday ${j<i?'got':''} ${j===i?'now':''}"><b>${j+1}</b><span>${d.t}</span></div>`).join('')}</div>
    <p class="small" style="margin:0">${n % 30 === 0 ? '<b>Сьогодні ще й міфічний улюбленець за 30 днів!</b>' : `До міфічного улюбленця: ${toMyth} ${toMyth===1?'день':toMyth<5?'дні':'днів'}.`}</p>
    <div class="btns" style="justify-content:center"><button class="btn primary" type="button" id="stOk">Забрати: ${STREAK[i].t.toLowerCase()}</button></div></div></div>`;
  document.getElementById('stOk').onclick = () => { root.innerHTML = ''; claimStreak(); };
}
function claimStreak(){
  if (!streakDue()) return;
  const n = streakNext(), i = (n-1) % 7, m = Math.min(2, 1 + .1*Math.floor((n-1)/7));
  W.streak = {day: todayStr(), n};
  let msg = '';
  if (i===0){ const v = Math.round(300*m); W.coins += v; msg = `+${v} монеток`; }
  else if (i===1){ const v = Math.round(400*m); W.coins += v; S.food += 20; msg = `+${v} монеток і 20 корму`; }
  else if (i===2){ S.tokens = (S.tokens||0) + 3; msg = '+3 жетони перекидання бонусів'; }
  else if (i===3){ const v = Math.round(1000*m); W.coins += v; msg = `+${v} монеток`; }
  else if (i===4){ msg = shardText(giveRandomShards(15, [0,10,30,30,20,8,2])); }
  else if (i===5){ openChest(true); msg = 'подарункова скриня'; }
  else { const coat = rndCoat(S.sp, 3); if (hasSpace()) giftAnimal(coat, 'Подарунок за 7 днів поспіль', {quiet:true}); else { addShards(coat, 40); msg = `40 уламків «${COATS[coat].n}» (немає місця)`; } }
  if (n % 30 === 0){ const coat = rndCoat(S.sp, 5); if (hasSpace()) setTimeout(() => giftAnimal(coat, `Подарунок за ${n} днів поспіль`), 600); else addShards(coat, 100); }
  if (msg) toast(`Подарунок за ${n}-й день: ${msg}`);
  logEvent(`Серія входів: ${n} ${n===1?'день':n<5?'дні':'днів'}`);
  touch(true); renderTop(); renderTab();
}

/* ---------- вкладка «Пригоди» ---------- */
let advSec = 'arena';
function viewAdv(){
  const secs = {arena:'Арена', season:'Сезон', quest:'Історії', exp:'Експедиції', merge:'Злиття', shards:'Уламки', secret:'Секрети'};
  let h = `<div class="sortchips">${Object.entries(secs).map(([k,n]) => `<button class="btn" type="button" data-act="advsec" data-k="${k}" aria-pressed="${advSec===k}">${n}</button>`).join('')}</div>`;
  h += `<div class="card streakcard"><div><b>Серія входів: ${W.streak.day===todayStr() || W.streak.day===yesterdayStr() ? W.streak.n : 0} ${W.streak.n===1?'день':'днів'}</b><br><span class="small muted">${W.streak.day===todayStr() ? 'Сьогоднішній подарунок отримано. Приходь завтра!' : 'Подарунок на сьогодні чекає'}</span></div>${streakDue() ? '<button class="btn primary" data-act="streak">Забрати</button>' : ''}</div>`;
  if (advSec==='arena') h += viewArena();
  else if (advSec==='season') h += viewSeason();
  else if (advSec==='quest') h += viewQuests();
  else if (advSec==='exp') h += viewExp();
  else if (advSec==='merge') h += viewMerge();
  else if (advSec==='shards') h += viewShards();
  else h += viewSecrets();
  return h;
}
function viewExp(){
  let h = `<div class="section"><h2>Експедиції</h2><p class="small muted" style="margin:0">Відправ до трьох улюбленців у подорож. Вони повернуться з монетками, уламками, а інколи й з новим другом. Що сильніша команда (рідкість, рівень, зірки), то кращі знахідки. Поки улюбленці в дорозі, вони не приносять монеток.</p>`;
  for (const e of S.exp){
    const done = now() >= e.endsAt, tot = e.endsAt - e.start;
    h += `<article class="card ${done?'ready':'active'}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${expName(e.kind)}</b><div class="teamrow small">${e.team.map(catById).filter(Boolean).map(c => catSVG(c, 'et'+c.id)).join('')}</div></div>
      <div class="bar mint"><span style="width:${clamp((now()-e.start)/tot*100,0,100)}%"></span></div>
      <div class="btns">${done ? `<button class="btn primary" data-act="expget" data-id="${e.id}">Зустріти команду</button>` : `<span class="small muted" data-expleft="${e.id}">Повернеться за ${fmtDur(e.endsAt-now())}</span>`}</div></article>`;
  }
  if (S.exp.length >= EXP_SLOTS) return h + `<p class="small muted">Обидві команди в дорозі. Нову можна відправити, коли хтось повернеться.</p></div>`;
  const ready = S.cats.filter(canTravel);
  expUI.team = expUI.team.filter(id => { const c = catById(id); return c && canTravel(c); });
  const od = expOdds(expUI.kind, expUI.team);
  h += `<div class="card"><b>Нова експедиція</b><div class="sortchips">${EXP_KINDS.map(E => `<button class="btn" type="button" data-act="expkind" data-k="${E.k}" aria-pressed="${expUI.kind===E.k}">${expName(E.k)} · ${fmtDur(E.ms)}</button>`).join('')}</div>
    <span class="small">Команда (${expUI.team.length} / 3) · сила ${teamPower(expUI.team).toFixed(1)} · шанс знайти друга ${Math.round(od.pet*100)}%${od.best[6] > .0005 ? ` · з них божественного ${(od.best[6]*100).toFixed(1)}%` : ''}</span>
    <div class="pickgrid2">${ready.length ? ready.map(c => `<button class="pickpet" type="button" data-act="expteam" data-id="${c.id}" aria-pressed="${expUI.team.includes(c.id)}">${catSVG(c, 'ep'+c.id)}<span>${esc(c.name)}</span><span class="rar r${COATS[c.coat].rar}">${RAR_NAMES[COATS[c.coat].rar]} · ${c.lvl}</span></button>`).join('') : '<span class="small muted">Немає вільних улюбленців: кошенята, хворі й ті, хто вже в дорозі, не можуть іти.</span>'}</div>
    <div class="btns"><button class="btn primary" data-act="expgo" ${expUI.team.length ? '' : 'disabled'}>Вирушити</button></div></div>`;
  return h + `</div>`;
}
function viewMerge(){
  let h = `<div class="section"><h2>Злиття</h2><p class="small muted" style="margin:0">Злий трьох улюбленців однієї рідкості в одного рідкіснішого. Три міфічні дають <b>божественного</b>. Ті троє підуть з притулку, а новий отримає їхній середній рівень. Секретних і тих, хто в дорозі, зливати не можна.</p>`;
  const by = [0,1,2,3,4,5].map(r => S.cats.filter(c => canMerge(c) && COATS[c.coat].rar===r));
  h += `<div class="sortchips">${by.map((l, r) => `<button class="btn" type="button" data-act="mergerar" data-k="${r}" aria-pressed="${mergeUI.r===r}" ${l.length>=3?'':'disabled'}>${RAR_NAMES[r]} · ${l.length}</button>`).join('')}</div>`;
  if (mergeUI.r < 0 || by[mergeUI.r].length < 3) return h + `<div class="card"><p class="small muted" style="margin:0">Вибери рідкість, де є щонайменше троє улюбленців.</p></div></div>`;
  mergeUI.sel = mergeUI.sel.filter(id => by[mergeUI.r].some(c => c.id===id));
  h += `<div class="card"><span class="small">Вибрано ${mergeUI.sel.length} з 3 → <span class="rar r${mergeUI.r+1}">${RAR_NAMES[mergeUI.r+1]}</span></span>
    <div class="pickgrid2">${by[mergeUI.r].map(c => `<button class="pickpet" type="button" data-act="mergesel" data-id="${c.id}" aria-pressed="${mergeUI.sel.includes(c.id)}">${catSVG(c, 'mg'+c.id)}<span>${esc(c.name)}</span><span class="small muted">рів. ${c.lvl}${c.stars?' · ★'+c.stars:''}</span></button>`).join('')}</div>
    <div class="btns"><button class="btn ${now()<mergeUI.arm?'primary':'mint'}" data-act="mergego" ${mergeUI.sel.length===3?'':'disabled'}>${now()<mergeUI.arm ? 'Точно? Натисни ще раз' : 'Злити трьох'}</button></div></div>`;
  return h + `</div>`;
}
function viewShards(){
  const list = coatsOf(S.sp).filter(k => !COATS[k].secret).sort((a, b) => (W.shards[b]||0)/SHARD_NEED[COATS[b].rar] - (W.shards[a]||0)/SHARD_NEED[COATS[a].rar] || COATS[b].rar - COATS[a].rar);

  let h = `<div class="section"><h2>Уламки</h2><p class="small muted" style="margin:0">Збирай уламки забарвлень і складай із них улюбленців. Уламки дають експедиції, скрині, міні-гра, щоденна скринька й серія входів. Що рідкісніше забарвлення, то більше уламків треба.</p>`;
  if (!have.length) h += `<div class="card"><p class="small muted" style="margin:0">Поки уламків немає. Відправ команду в експедицію або відкрий скриню.</p></div>`;
  h += `<div class="grid">${have.map(k => { const c = COATS[k], n = W.shards[k], need = SHARD_NEED[c.rar];
    return `<article class="card"><div class="cathead"><div class="pic">${S.seenCoats[k] ? catSVG({coat:k, wear:{}}, 'sh'+k) : `<span style="opacity:.55">${catSVG({coat:k, wear:{}}, 'sh'+k)}</span>`}</div><div style="min-width:0"><b>${c.n}</b><span class="rar r${c.rar}">${RAR_NAMES[c.rar]}</span></div></div>

      <div class="btns"><button class="btn primary" data-act="craft" data-k="${k}" ${n>=need?'':'disabled'}>Зібрати</button></div></article>`; }).join('')}</div>`;

}
function viewSecrets(){
  const sec = coatsOf(S.sp).filter(k => COATS[k].secret);

    return `<article class="card"><div class="cathead"><div class="pic">${got ? catSVG({coat:k, wear:{}}, 'se'+k) : '<svg viewBox="0 0 100 100" width="56" height="56"><circle cx="50" cy="55" r="30" fill="var(--surface2)"/><text x="50" y="66" text-anchor="middle" font-size="30" font-weight="800" fill="var(--muted)">?</text></svg>'}</div>
      <div style="min-width:0"><b>${got ? c.n : '???'}</b><span class="small muted">${got ? 'Уже в колекції' : 'Підказка: ' + SECRET_HINT[c.secret].toLowerCase()}</span>${c.secret==='talk' && !got ? `<br><span class="small muted">Розмов: ${S.stats.talks||0} / 50</span>` : ''}</div></div></article>`; }).join('')}</div></div>`;
}

/* ================= Арена: онлайн-змагання 2–4 гравців у реальному часі =================
   Кімнати й ігри працюють через Supabase Realtime (presence + broadcast). Господар кімнати
   (хто її створив) розсуджує спірні моменти й керує ботами. Без мережі — гра з ботами. */
const AR_GAMES = {
  race:  {n:'Перегони', d:'Тисни «Біг!» якомога частіше. Що сильніший улюбленець, то далі він біжить від кожного натискання.'},
  treat: {n:'Ловля смаколиків', d:'Хапай смаколики раніше за суперників. Сильніший улюбленець отримує більше очок, а реп’яхи забирають очки.'}
};
const AR_MAX_REWARDS = 15;
const ARENA = {lobby:null, rooms:[], room:null, G:null, ui:{game:'race', max:4, pet:null, code:''}, err:''};
const petPS = c => { const k = COATS[c.coat]; return (1 + .18*k.rar) * (1 + .04*((c.lvl||1)-1)) * (1 + .05*(c.stars||0)) * (c.kitten ? .8 : 1); };
const psMult = ps => .85 + .15*Math.min(4, ps||1);
const petCardOf = c => ({coat:c.coat, name:String(c.name).slice(0,24), lvl:c.lvl||1, stars:c.stars||0, ps:+petPS(c).toFixed(2)});
const arPetSafe = p => (p && COATS[p.coat]) ? {coat:p.coat, name:String(p.name||'?').slice(0,24), lvl:clamp(+p.lvl||1,1,CAT_MAX_LVL), stars:clamp(+p.stars||0,0,STAR_MAX), ps:clamp(+p.ps||1,.5,4)} : {coat:'ginger', name:'?', lvl:1, stars:0, ps:1};
const arMyId = () => { if (!W.player.id) newIdentity(W); return W.player.id; };
const arNick = () => W.player.nick || ('Гість ' + arMyId().slice(0,4).toUpperCase());
const arDay = () => { if (!W.arena || W.arena.day !== todayStr()) W.arena = {day: todayStr(), games:0, wins:(W.arena && W.arena.wins)||0, played:(W.arena && W.arena.played)||0}; return W.arena; };
function arPickPet(){
  const list = S.cats.filter(c => !c.away && !c.treatUntil);
  let c = list.find(x => x.id === ARENA.ui.pet);
  if (!c){ c = list.slice().sort((a,b) => petPS(b) - petPS(a))[0]; if (c) ARENA.ui.pet = c.id; }
  return c;
}
/* ---------- лобі ---------- */
function arLobbyJoin(){
  if (!netReady() || ARENA.lobby) return;
  const ch = db().channel('kp-arena', {config:{presence:{key: arMyId()}}});
  ch.on('presence', {event:'sync'}, () => {
    const st = ch.presenceState(), rooms = [];
    for (const k in st){ const m = st[k][0]; if (m && m.room && m.open && m.id !== arMyId()) rooms.push(m); }
    const list = rooms.sort((a,b) => (b.at||0) - (a.at||0)).slice(0, 30), sig = JSON.stringify(list.map(r => [r.room, r.n, r.max, r.game]));
    ARENA.rooms = list; if (sig === ARENA.roomSig) return; ARENA.roomSig = sig;
    if (tab==='adv' && advSec==='arena' && document.activeElement?.id !== 'arCode') renderTab();
  });
  ch.subscribe();
  ARENA.lobby = ch;
}
function arLobbyAnnounce(){
  const ch = ARENA.lobby, r = ARENA.room; if (!ch) return;
  if (r && !r.offline && r.hostId === arMyId()) ch.track({id: arMyId(), room: r.code, nick: arNick(), game: r.game, max: r.max, n: arMembers().length, open: !ARENA.G && arMembers().length < r.max, at: r.at});
  else ch.untrack().catch(()=>{});
}
/* ---------- кімната ---------- */
const AR_CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const arCode = () => Array.from({length:4}, () => AR_CODE_CH[Math.floor(Math.random()*AR_CODE_CH.length)]).join('');
function arMembers(){
  const r = ARENA.room; if (!r) return [];
  return [...r.members.values(), ...r.bots].sort((a,b) => (a.joinedAt||0) - (b.joinedAt||0));
}
function arMeMeta(){
  const r = ARENA.room, c = arPickPet();
  return {id: arMyId(), nick: arNick(), pet: c ? petCardOf(c) : null, ready: !!r.ready, joinedAt: r.joinedAt, host: r.hostId===arMyId(), game: r.game, max: r.max, playing: !!ARENA.G};
}
async function arCreate(offline){
  const c = arPickPet(); if (!c){ toast('Немає вільного улюбленця для арени'); return; }
  arLeave(true);
  const code = arCode();
  ARENA.room = {code, game: ARENA.ui.game, max: ARENA.ui.max, offline: !!offline || !netReady(), members:new Map(), bots:[], hostId: arMyId(), joinedAt: now(), at: now(), ready:true, ch:null};
  if (ARENA.room.offline){
    ARENA.room.members.set(arMyId(), arMeMeta());
    const n = Math.max(1, ARENA.room.max - 1); for (let i = 0; i < n; i++) arAddBot();
  } else await arConnect(code);
  arShowRoom();
}
async function arJoin(code){
  code = String(code||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  if (code.length !== 4){ toast('Код кімнати — 4 літери'); return; }
  if (!netReady()){ toast('Онлайн-арена працює на сайті гри'); return; }
  if (!arPickPet()){ toast('Немає вільного улюбленця для арени'); return; }
  arLeave(true);
  ARENA.room = {code, game:'race', max:4, offline:false, members:new Map(), bots:[], hostId:null, joinedAt: now(), ready:false, ch:null, joining:true};
  await arConnect(code);
  arShowRoom();
  setTimeout(() => { const r = ARENA.room; if (r && r.code===code && r.joining){
    const others = [...r.members.values()].filter(m => m.id !== arMyId());
    if (!others.length){ toast('Кімнату не знайдено. Перевір код'); arLeave(); }
  } }, 4000);
}
function arConnect(code){
  return new Promise(res => {
    const r = ARENA.room;
    const ch = db().channel('kp-room-' + code, {config:{presence:{key: arMyId()}, broadcast:{self:false}}});
    r.ch = ch;
    ch.on('presence', {event:'sync'}, () => arSync());
    ['start','pos','fin','claim','take','res','bots','kick','back'].forEach(ev => ch.on('broadcast', {event:ev}, ({payload}) => arOn(ev, payload || {}, false)));
    let done = false;
    ch.subscribe(async st => {
      if (st === 'SUBSCRIBED'){ await ch.track(arMeMeta()); if (!done){ done = true; res(); } }
      else if ((st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') && !done){ done = true; ARENA.err = 'Не вдалося під’єднатися до арени'; toast(ARENA.err); res(); }
    });
    setTimeout(() => { if (!done){ done = true; res(); } }, 6000);
  });
}
function arSync(){
  const r = ARENA.room; if (!r || !r.ch) return;
  const st = r.ch.presenceState(); r.members = new Map();
  for (const k in st){ const m = st[k][0]; if (m && m.id) r.members.set(m.id, Object.assign({}, m, {nick:String(m.nick||'Гравець').slice(0,20), pet: arPetSafe(m.pet)})); }
  const humans = [...r.members.values()].sort((a,b) => (a.joinedAt||0) - (b.joinedAt||0));
  const host = humans.find(m => m.host) || humans[0];
  if (host){
    r.hostId = host.id;
    if (host.id !== arMyId()){ r.game = AR_GAMES[host.game] ? host.game : 'race'; r.max = clamp(+host.max||4, 2, 4); }
  }
  if (r.joining && humans.length > 1){
    r.joining = false;
    const meI = humans.findIndex(m => m.id===arMyId());
    if ((host && host.playing) || meI >= r.max){ toast(host && host.playing ? 'У цій кімнаті вже йде гра. Спробуй трохи згодом' : 'Кімната вже заповнена'); arLeave(); return; }
  }
  if (ARENA.G){ const ids = new Set(arMembers().map(m => m.id)); ARENA.G.left = ARENA.G.ids.filter(id => !ids.has(id)); }
  arLobbyAnnounce();
  arRenderRoom();
}
function arTrack(){ const r = ARENA.room; if (r && r.ch) r.ch.track(arMeMeta()).catch(()=>{}); else if (r) { r.members.set(arMyId(), arMeMeta()); arRenderRoom(); } }
const BOT_N = ['Пушок','Сніжок','Рижик','Тофі','Буся','Кекс','Ласка','Персик','Бублик','Зефір','Вафля','Ґудзик'];
function arAddBot(){
  const r = ARENA.room; if (!r || r.hostId !== arMyId() || arMembers().length >= r.max) return;
  const c = arPickPet(), myR = c ? COATS[c.coat].rar : 1, rr = clamp(myR + Math.round(rand(-1.4, 1.2)), 0, 5);
  const coat = rndCoat(S.sp, rr), lvl = clamp(Math.round((c ? c.lvl : 3) + rand(-2.5, 2)), 1, CAT_MAX_LVL);
  const usedN = new Set(r.bots.map(x => x.pet.name)), freeN = BOT_N.filter(n => !usedN.has(n)); const pet = {coat, name: rnd(freeN.length ? freeN : BOT_N), lvl, stars: lvl >= 10 ? Math.floor(rand(0, 3)) : 0}; pet.ps = +petPS(pet).toFixed(2);
  r.bots.push({id:'bot' + Math.random().toString(36).slice(2,8), nick:'Бот ' + pet.name, pet, ready:true, bot:true, joinedAt: now() + r.bots.length, skill: rand(.75, 1.1)});
  arSend('bots', {bots: r.bots}); arLobbyAnnounce(); arRenderRoom();
}
function arDelBot(id){ const r = ARENA.room; if (!r || r.hostId !== arMyId()) return; r.bots = r.bots.filter(b => b.id !== id); arSend('bots', {bots:r.bots}); arLobbyAnnounce(); arRenderRoom(); }
function arLeave(silent){
  const r = ARENA.room; if (!r) return;
  if (r.ch){ try { r.ch.untrack(); r.ch.unsubscribe(); db().removeChannel(r.ch); } catch(e){} }
  ARENA.room = null; ARENA.G = null; cancelAnimationFrame(arLoop.raf);
  const root = document.getElementById('arenaRoot'); if (root) root.innerHTML = '';
  arLobbyAnnounce();
  if (!silent && tab==='adv') renderTab();
}
function arSend(ev, p){
  const r = ARENA.room; if (!r) return;
  if (r.ch) r.ch.send({type:'broadcast', event:ev, payload:p}).catch(()=>{});
  arOn(ev, p, true);
}
/* ---------- вікно кімнати ---------- */
function arShowRoom(){
  let root = document.getElementById('arenaRoot');
  if (!root){ root = document.createElement('div'); root.id = 'arenaRoot'; document.body.appendChild(root); }
  root.innerHTML = `<div class="overlay arena" id="arOverlay"><div class="modal arenamodal" role="dialog" aria-modal="true" aria-labelledby="arTitle"><div id="arBody"></div></div></div>`;
  root.querySelector('#arOverlay').addEventListener('click', arClick);
  arRenderRoom();
}
function arRenderRoom(){
  const body = document.getElementById('arBody'), r = ARENA.room; if (!body || !r || ARENA.G) return;
  const sig = JSON.stringify([arMembers().map(m => [m.id, m.ready, m.nick, m.pet && m.pet.coat, m.pet && m.pet.lvl]), r.hostId, r.game, r.max, r.joining, r.ready, arDay().games]);
  if (sig === body.dataset.sig) return; body.dataset.sig = sig;
  const ms = arMembers(), isHost = r.hostId === arMyId(), humans = ms.filter(m => !m.bot);
  const allReady = ms.every(m => m.ready || m.id===r.hostId);
  body.innerHTML = `<div class="sheethead" style="width:100%"><div><h2 id="arTitle">${AR_GAMES[r.game].n}</h2><span class="small muted">${r.offline ? 'Тренування з ботами' : `Кімната <b class="code">${r.code}</b> · ${ms.length} / ${r.max}`}</span></div>
      <button class="btn ghost" type="button" data-ar="leave">Вийти</button></div>
    <p class="small muted" style="margin:0">${AR_GAMES[r.game].d}</p>
    ${r.joining ? '<p class="small">Під’єднуюся до кімнати…</p>' : ''}
    <div class="arplayers">${ms.map(m => `<div class="arp ${m.id===arMyId()?'me':''}">${catSVG({coat:m.pet.coat, wear:{}}, 'arp'+m.id)}<div style="min-width:0"><b>${esc(m.nick)}${m.id===r.hostId?' · господар':''}</b>
        <span class="small muted">${esc(m.pet.name)} · ${RAR_NAMES[COATS[m.pet.coat].rar]} · рів. ${m.pet.lvl}${m.pet.stars?' · ★'+m.pet.stars:''}</span>
        <span class="small">Сила ×${psMult(m.pet.ps).toFixed(2)} · ${m.bot || m.ready || m.id===r.hostId ? '<b class="okc">готовий</b>' : 'чекає'}</span></div>
        ${m.bot && isHost ? `<button class="btn ghost" type="button" data-ar="delbot" data-id="${m.id}" aria-label="Прибрати бота">✕</button>` : ''}</div>`).join('')}
      ${Array.from({length: Math.max(0, r.max - ms.length)}, () => `<div class="arp empty"><span class="small muted">${isHost ? 'Вільне місце' : 'Чекаємо гравців…'}</span>${isHost ? '<button class="btn" type="button" data-ar="bot">+ Бот</button>' : ''}</div>`).join('')}
    </div>
    ${!r.offline ? `<p class="small muted" style="margin:0">Поділися кодом <b class="code">${r.code}</b> з друзями, або вони знайдуть кімнату в списку на вкладці «Пригоди» → «Арена».</p>` : ''}
    <div class="btns" style="justify-content:center">
      ${isHost ? `<button class="btn primary" type="button" data-ar="start" ${ms.length >= 2 && allReady ? '' : 'disabled'}>${ms.length < 2 ? 'Потрібно щонайменше 2 гравці' : allReady ? 'Почати гру' : 'Чекаємо, поки всі будуть готові'}</button>`
        : `<button class="btn ${r.ready?'':'primary'}" type="button" data-ar="ready">${r.ready ? 'Я не готовий' : 'Я готовий'}</button>`}
    </div>
    <p class="small muted" style="margin:0">Нагороди сьогодні: ${Math.max(0, AR_MAX_REWARDS - arDay().games)} з ${AR_MAX_REWARDS} ігор.${humans.length < 2 && !r.offline ? ' Можна додати ботів, якщо друзі ще не прийшли.' : ''}</p>`;
}
function arClick(e){
  const b = e.target.closest('[data-ar]'); if (!b || b.disabled) return;
  const a = b.dataset.ar, r = ARENA.room;
  if (a==='leave') arLeave();
  else if (a==='bot') arAddBot();
  else if (a==='delbot') arDelBot(b.dataset.id);
  else if (a==='ready' && r){ r.ready = !r.ready; arTrack(); }
  else if (a==='start') arStart();
  else if (a==='tap') arTap();
  else if (a==='again'){ if (r && r.hostId===arMyId()) arSend('back', {}); else { ARENA.G = null; if (r){ r.ready = false; arTrack(); } arRenderRoom(); } }
}
/* ---------- початок гри ---------- */
function arStart(){
  const r = ARENA.room; if (!r || r.hostId !== arMyId()) return;
  const ms = arMembers(); if (ms.length < 2) return;
  const roster = ms.slice(0, 4).map(m => ({id:m.id, nick:m.nick, pet:m.pet, bot:!!m.bot, skill:m.skill||1}));
  arSend('start', {game: r.game, seed: Math.floor(Math.random()*1e9), roster});
}
function seededRng(seed){ let h = seed >>> 0 || 1; return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
const TREAT_KINDS = [{v:1, w:58, c:'#F6F3EE'}, {v:2, w:22, c:'#F7C948'}, {v:5, w:7, c:'#FF7CA8'}, {v:-3, w:13, c:'#6FAE5A'}];
function arOn(ev, p, local){
  const r = ARENA.room; if (!r) return;
  const isHost = r.hostId === arMyId();
  if (ev==='bots'){ if (!local && Array.isArray(p.bots)) { r.bots = p.bots.slice(0,3).map(b => Object.assign({}, b, {pet: arPetSafe(b.pet), bot:true, ready:true})); arRenderRoom(); } return; }
  if (ev==='back'){ ARENA.G = null; r.ready = isHost; arTrack(); arRenderRoom(); arShowRoomIfGame(); return; }
  if (ev==='start'){
    if (!Array.isArray(p.roster) || !AR_GAMES[p.game]) return;
    const roster = p.roster.slice(0,4).map(m => ({id:String(m.id), nick:String(m.nick||'?').slice(0,20), pet:arPetSafe(m.pet), bot:!!m.bot, skill:+m.skill||1}));
    if (!roster.some(m => m.id===arMyId())) return;
    const t0 = now() + 3200, rng = seededRng(p.seed);
    const G = ARENA.G = {game:p.game, t0, roster, ids:roster.map(m=>m.id), left:[], st:{}, done:false, res:null, rewarded:false, lastPos:0, taps:[]};
    roster.forEach((m, i) => G.st[m.id] = {x:0, v:0, shown:0, fin:null, score:0, lane:i, botNext:0});
    if (p.game==='treat'){
      G.treats = []; let t = .6;
      while (t < 29.4){ let k = TREAT_KINDS[0], pick = rng()*100; for (const kk of TREAT_KINDS){ pick -= kk.w; if (pick <= 0){ k = kk; break; } }
        G.treats.push({i:G.treats.length, t, life:1.55, x:8 + rng()*84, y:10 + rng()*78, v:k.v, c:k.c, by:null, pend:false, botAt:{}}); t += .36 + rng()*.22; }
      G.dur = 31;

function arLoop(ts){

    } else {

}

/* ================= Професії улюбленців ================= */
const PROFS = {
  guard:   {n:'Охоронець',   per:[2,3,4,5,6],       cap:20, d:v=>`+${v}% монеток від усіх улюбленців будинку`},
  cook:    {n:'Кухар',       per:[3,5,7,9,12],      cap:30, d:v=>`усі голоднішають на ${v}% повільніше`},
  anim:    {n:'Аніматор',    per:[3,5,7,9,12],      cap:30, d:v=>`усі сумують на ${v}% повільніше`},
  medic:   {n:'Лікар',       per:[10,15,20,25,30],  cap:60, d:v=>`хворіють на ${v}% рідше, лікування швидше`},
  rescuer: {n:'Рятувальник', per:[3,5,7,9,12],      cap:30, d:v=>`порятунки на ${v}% швидші`},
  scout:   {n:'Шукач',       per:[5,8,11,14,18],    cap:40, d:v=>`+${v}% нагород з експедицій`},
  artist:  {n:'Артист',      per:[5,8,11,14,18],    cap:40, d:v=>`відвідувачі дають на ${v}% більше`}
};
const PROF_LVL_MIN = [0, 60, 180, 420, 900], PROF_REQ = 3, PROF_CHANGE = 200;
const profLvl = c => { const x = (c.prof && c.prof.xp) || 0; let l = 1; while (l < 5 && x >= PROF_LVL_MIN[l]) l++; return l; };
const profVal = c => c.prof && PROFS[c.prof.k] ? PROFS[c.prof.k].per[profLvl(c)-1] : 0;
function profSum(k){
  if (!S) return 0;
  let v = 0; for (const c of S.cats) if (c.prof && c.prof.k===k && !c.away) v += profVal(c);
  return Math.min(PROFS[k].cap, v) / 100;
}
function profBlock(c){
  if ((c.lvl||1) < PROF_REQ) return `<div class="perkbox"><b>Професія</b><p class="small muted" style="margin:0">Відкриється на ${PROF_REQ} рівні. Улюбленець з професією допомагає всьому будинку.</p></div>`;
  const p = c.prof && PROFS[c.prof.k], l = profLvl(c), x = (c.prof && c.prof.xp) || 0;
  const next = l < 5 ? PROF_LVL_MIN[l] : 0;
  return `<div class="perkbox"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b>Професія</b>${p ? `<span class="small muted">рівень ${l} / 5</span>` : ''}</div>
    ${p ? `<span class="small"><b>${p.n}</b>: ${p.d(p.per[l-1])}</span>${l < 5 ? `<div class="bar mint"><span style="width:${Math.min(100, (x - PROF_LVL_MIN[l-1])/(next - PROF_LVL_MIN[l-1])*100)}%"></span></div><span class="small muted">Досвід професії росте, поки улюбленець удома: ще ${Math.ceil(next - x)} хв до ${l+1} рівня</span>` : '<span class="rar r1">Майстер своєї справи</span>'}` : '<span class="small muted">Вибери, чим займатиметься улюбленець. Бонус діє на весь будинок і росте з досвідом.</span>'}
    <label class="selrow" for="prof${c.id}">${p ? 'Змінити' : 'Вибрати'}: <select id="prof${c.id}" data-proffor="${c.id}"><option value="">${p ? '—' : 'Без професії'}</option>${Object.entries(PROFS).map(([k,v]) => `<option value="${k}" ${p && c.prof.k===k ? 'selected' : ''}>${v.n}</option>`).join('')}</select></label>
    ${p ? `<span class="small muted">Зміна професії коштує ${PROF_CHANGE} монеток і скидає її досвід.</span>` : ''}</div>`;
}
function setProf(c, k){
  if (!c || (c.lvl||1) < PROF_REQ) return;
  if (!k){ if (c.prof){ c.prof = null; toast(`${c.name} більше не має професії`); } touch(true); renderCatSheet(); return; }
  if (!PROFS[k] || (c.prof && c.prof.k===k)) return;
  if (c.prof){ if (W.coins < PROF_CHANGE){ toast('Не вистачає монеток'); renderCatSheet(); return; } W.coins -= PROF_CHANGE; }
  c.prof = {k, xp:0};
  toast(`${c.name} тепер ${PROFS[k].n.toLowerCase()}! ${PROFS[k].d(PROFS[k].per[0])}`);
  task('prof'); touch(true); renderTop(); renderCatSheet(); renderTab();
}

function seasonEnsure(){
  if (!W.season || W.season.id !== seasonId()) W.season = {id: seasonId(), xp:0, claimed:{}, day:'', daily:[], week:'', weekly:[]};
  const s = W.season;
  if (s.day !== todayStr()){ s.day = todayStr(); s.daily = SEASON_DAILY.slice().sort(() => Math.random() - .5).slice(0, 5).map(d => ({k:d.k, n:d.n, x:d.x, t:d.t, have:0, done:false})); }
  if (s.week !== weekId()){ s.week = weekId(); s.weekly = SEASON_WEEKLY.slice().sort(() => Math.random() - .5).slice(0, 4).map(d => ({k:d.k, n:d.n, x:d.x, t:d.t, have:0, done:false})); }
  return s;
}
const seasonLvl = () => Math.min(SEASON_MAX, Math.floor((W.season ? W.season.xp : 0) / SEASON_XP));
function seasonEvt(k, n){
  if (!W || bgMode || visiting) return;
  const s = seasonEnsure(); let gained = 0;
  for (const t of [...s.daily, ...s.weekly]) if (t.k===k && !t.done){ t.have = Math.min(t.n, t.have + n); if (t.have >= t.n){ t.done = true; gained += t.x; toast(`Сезонне завдання: ${t.t} · +${t.x} очок сезону`); } }
  if (gained) seasonAdd(gained);
}
function seasonAdd(x){
  const s = seasonEnsure(), before = seasonLvl(); s.xp += x; const after = seasonLvl();
  if (after > before){ note(`Сезонний пропуск: рівень ${after}! Забери нагороду на вкладці «Пригоди» → «Сезон»`); }
  touch();
}
function seasonReward(L){
  if (L===100) return {k:'pet', r:6, t:'Божественний улюбленець'};
  if (L===75) return {k:'pet', r:5, t:'Міфічний улюбленець'};
  if (L===50) return {k:'pet', r:4, t:'Легендарний улюбленець'};
  if (L===25) return {k:'pet', r:3, t:'Епічний улюбленець'};
  if (L % 10 === 0){ const it = SEASON_FURN[(L/10 - 1) % SEASON_FURN.length]; return {k:'furn', f:it, t:FURN[it].n}; }
  if (L % 5 === 0) return {k:'chest', t:'Подарункова скриня'};
  if (L % 4 === 3) return {k:'shards', n:8 + Math.floor(L/10)*2, t:`${8 + Math.floor(L/10)*2} уламків`};
  if (L % 4 === 1) return {k:'tokens', n:2, t:'2 жетони перекидання'};
  if (L % 6 === 2) return {k:'food', n:25, t:'25 корму'};
  return {k:'coins', n:200 + 20*L, t:`${(200 + 20*L).toLocaleString('uk-UA')} монеток`};
}
function seasonClaim(L){
  const s = seasonEnsure(); if (L > seasonLvl() || s.claimed[L]) return false;
  const r = seasonReward(L);
  if (r.k==='pet' && !hasSpace()){ toast('Звільни місце в притулку, щоб забрати улюбленця'); return false; }
  s.claimed[L] = true;
  if (r.k==='coins'){ W.coins += r.n; }
  else if (r.k==='food') S.food += r.n;
  else if (r.k==='tokens') S.tokens = (S.tokens||0) + r.n;
  else if (r.k==='shards') giveRandomShards(r.n, [0,10,30,30,20,8,2]);
  else if (r.k==='chest') openChest(true);
  else if (r.k==='furn'){ W.furn[r.f] = (W.furn[r.f]||0) + 1; toast(`Нові меблі: ${FURN[r.f].n}. Постав їх у кімнаті через «Дизайн»`); }
  else if (r.k==='pet') giftAnimal(rndCoat(S.sp, r.r), `Сезонний пропуск, рівень ${L}`);
  logEvent(`Сезон, рівень ${L}: ${r.t}`);
  touch(true); renderTop();
  return true;
}
let seasonPage = -1;

  if (seasonPage < 0) seasonPage = Math.min(9, Math.floor(Math.max(0, (unclaimed[0] || L+1) - 1)/10));
  const row = t => `<div class="task ${t.done?'done':''}"><span>${t.t}</span><b class="small">${t.done ? '✓' : '+' + t.x}</b><div class="bar mint"><span style="width:${t.have/t.n*100}%"></span></div><span class="small muted" style="grid-column:1/-1">${t.have} / ${t.n}</span></div>`;

      ${L < SEASON_MAX ? `<div class="bar gold"><span style="width:${inLvl/SEASON_XP*100}%"></span></div><span class="small muted">${inLvl} / ${SEASON_XP} очок до наступного рівня</span>` : '<span class="rar r6">Сезон пройдено повністю!</span>'}
      ${unclaimed.length ? `<button class="btn primary" data-act="sclaimall">Забрати всі нагороди · ${unclaimed.length}</button>` : ''}

    <div class="card"><b>Завдання на сьогодні</b>${s.daily.map(row).join('<hr class="thin">')}</div>
    <div class="card"><b>Завдання тижня</b>${s.weekly.map(row).join('<hr class="thin">')}</div>
    <div class="sortchips">${Array.from({length:10}, (_, p) => `<button class="btn" type="button" data-act="spage" data-k="${p}" aria-pressed="${seasonPage===p}">${p*10+1}–${p*10+10}</button>`).join('')}</div>
    <div class="spass">${Array.from({length:10}, (_, i) => { const l = seasonPage*10 + i + 1, r = seasonReward(l), got = s.claimed[l], open = l <= L;
      return `<div class="sstep ${got?'got':open?'open':''} ${l%25===0?'big':''}"><span class="snum">${l}</span><span class="sico">${seasonIcon(r)}</span><span class="small stxt">${r.t}</span>
        ${got ? '<span class="small okc">отримано</span>' : open ? `<button class="btn primary" data-act="sclaim" data-k="${l}">Забрати</button>` : '<span class="small muted">закрито</span>'}</div>`; }).join('')}</div></div>`;
  return h;
}
function seasonIcon(r){
  if (r.k==='pet') return catSVG({coat: rollPool(S.sp, r.r)[0] || SP().start, wear:{}}, 'si'+r.r);
  if (r.k==='furn') return `<svg viewBox="-30 -46 60 50">${furn2D(r.f)}</svg>`;

}

const questOf = () => { if (!S.quest) S.quest = {ch:0, st:0, have:0}; return S.quest; };
function questEvt(k, n){
  if (!S || bgMode || visiting) return;
  const q = questOf(), ch = QUESTS[q.ch]; if (!ch) return;
  const st = ch.steps[q.st]; if (!st || st.k !== k || q.have >= st.n) return;
  q.have = Math.min(st.n, q.have + n);
  if (q.have >= st.n) toast(`Історія «${ch.t}»: крок виконано! Продовж на вкладці «Пригоди» → «Історії»`);
  touch();
}
function questNext(){
  const q = questOf(), ch = QUESTS[q.ch]; if (!ch) return;
  const st = ch.steps[q.st]; if (!st || q.have < st.n) return;
  W.coins += 150 + 50*q.ch; gainXp(8); task('quest');
  q.st++; q.have = 0;
  if (q.st >= ch.steps.length){
    const r = ch.reward; let txt = [];
    if (r.coins){ W.coins += r.coins; txt.push(`${r.coins.toLocaleString('uk-UA')} монеток`); }
    if (r.furn){ W.furn[r.furn] = (W.furn[r.furn]||0) + 1; txt.push(`меблі «${FURN[r.furn].n}»`); }
    logEvent(`Історію «${ch.t}» завершено! Нагорода: ${txt.join(', ')}`);
    q.ch++; q.st = 0;
    touch(true); renderTop();
    if (r.chest) openChest(true);
    if (r.pet){ if (hasSpace()) giftAnimal(rndCoat(S.sp, r.pet), `Нагорода за історію «${ch.t}»`); else W.shards[rndCoat(S.sp, r.pet)] = (W.shards[rndCoat(S.sp, r.pet)]||0) + 50; }
    toast(`Історію «${ch.t}» завершено! ${txt.join(', ')}`);
  } else toast(`+${150 + 50*(q.ch)} монеток. Наступний крок історії відкрито`);
  touch(true); renderTop(); renderTab();
}
function viewQuests(){
  const q = questOf(), ch = QUESTS[q.ch];
  let h = `<div class="section"><h2>Історії</h2><p class="small muted" style="margin:0">Сюжетні пригоди притулку. Кожен крок — невелике завдання, а наприкінці історії чекає особлива нагорода. У кожного будинку свої історії.</p>`;
  h += `<div class="qlist">${QUESTS.map((c, i) => `<span class="rar ${i < q.ch ? 'r1' : i===q.ch ? 'r4' : ''}">${i < q.ch ? '✓ ' : ''}${c.t}</span>`).join('')}</div>`;
  if (!ch) return h + `<div class="card"><b>Усі історії пройдено!</b><p class="small muted" style="margin:0">Нові історії з’являться в наступних оновленнях.</p></div></div>`;
  const st = ch.steps[q.st], done = q.have >= st.n;
  h += `<div class="card questcard"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b>${ch.t}</b><span class="small muted">крок ${q.st+1} з ${ch.steps.length}</span></div>
    <div class="qsteps">${ch.steps.map((s, i) => `<i class="${i < q.st ? 'on' : i===q.st ? 'cur' : ''}"></i>`).join('')}</div>
    <p class="story" style="margin:0">${st.d}</p>
    <div class="bar mint"><span style="width:${q.have/st.n*100}%"></span></div><span class="small muted">${q.have} / ${st.n}</span>
    <div class="btns">${done ? `<button class="btn primary" data-act="qnext">${q.st===ch.steps.length-1 ? 'Завершити історію' : 'Далі'} · +${150 + 50*q.ch} монеток</button>` : '<span class="small muted">Виконуй завдання в грі, і прогрес з’явиться тут.</span>'}</div>
    <span class="small muted">Нагорода за всю історію: ${[ch.reward.coins ? ch.reward.coins.toLocaleString('uk-UA') + ' монеток' : '', ch.reward.chest ? 'скриня' : '', ch.reward.furn ? 'меблі «' + FURN[ch.reward.furn].n + '»' : '', ch.reward.pet ? RAR_NAMES[ch.reward.pet].toLowerCase() + ' улюбленець' : ''].filter(Boolean).join(', ')}</span></div>`;
  return h + `</div>`;
}

function syncFurn3D(){

  const room = S.curRoom || 'main', d = S.design && S.design.items && S.design.items[room] || [];

  if (sig === R3.furnSig) return; R3.furnSig = sig;
  if (R3.furn) R3.scene.remove(R3.furn);
  const g = new R3.T.Group(); R3.furn = g; R3.scene.add(g);
  for (const it of d){ const o = furn3D(it.k), p = w3(it.x, it.y); o.position.set(p.x, ROOM3.floorY - .01 + (S.sp==='fish' ? .0 : 0), p.z); o.rotation.y = (it.r||0) * Math.PI/4; o.scale.setScalar(1.15); g.add(o); }

  if (env){
    const w = S.design && S.design.wall && S.design.wall[room], f = S.design && S.design.floor && S.design.floor[room];
    for (const [m, c] of [[env.userData.wallM, w], [env.userData.floorM, f]]) if (m){ if (!m.userData.orig) m.userData.orig = '#' + m.color.getHexString(); m.color.set(c || m.userData.orig); }
  }
}

function shrinkImage(src, max){
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width*k)); c.height = Math.max(1, Math.round(im.height*k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    let q = .78, d = c.toDataURL('image/jpeg', q); while (d.length > 380000 && q > .3){ q -= .12; d = c.toDataURL('image/jpeg', q); }
    res(d); }; im.onerror = rej; im.src = src; });
}

}

const giftText = g => g.kind==='coins' ? `${Number(g.payload.n).toLocaleString('uk-UA')} монеток` : g.kind==='food' ? `${g.payload.n} порцій корму` : (g.payload && COATS[g.payload.coat] ? `${g.payload.name} (${COATS[g.payload.coat].n}, ${RAR_NAMES[COATS[g.payload.coat].rar].toLowerCase()})` : 'улюбленець');
async function loadGifts(){
  if (!chatOk() || GIFTS.loading) return;
  GIFTS.loading = true; GIFTS.at = now();
  try { const { data, error } = await db().rpc('gift_list', {p_id: W.player.id, p_secret: W.player.secret}); if (error) throw error;
    GIFTS.rows = (data || []).filter(g => g && (g.kind!=='pet' || validPet(g.payload))); }
  catch(e){ console.warn(e); }
  GIFTS.loading = false; renderTop();
  if (tab==='players' && playersSec==='gifts') renderTab();
}
function openGift(toId, nick){
  if (!chatOk()){ toast('Щоб дарувати подарунки, приєднайся до таблиці лідерів'); return; }
  if (!toId || toId === W.player.id) return;
  const st = {kind:'coins', pet:null};
  const root = document.getElementById('modalRoot');
  const draw = () => {
    const pets = S.cats.filter(canTrade);
    const og = document.getElementById('gpGrid'), sTop = og ? og.scrollTop : 0, om = document.getElementById('gsMsg'), msgV = om ? om.value : '';
    root.innerHTML = `<div class="overlay" id="gfOv"><div class="modal giftsend" role="dialog" aria-modal="true" aria-labelledby="gsTitle">
      <h2 id="gsTitle">Подарунок для <span data-nol10n>${esc(nick)}</span></h2>
      <div class="sortchips"><button class="btn" type="button" data-gk="coins" aria-pressed="${st.kind==='coins'}">${ICON.coin} Золото</button><button class="btn" type="button" data-gk="food" aria-pressed="${st.kind==='food'}">${ICON.food} Корм</button><button class="btn" type="button" data-gk="pet" aria-pressed="${st.kind==='pet'}">Улюбленець</button></div>
      ${st.kind==='coins' ? `<label class="selrow" for="gsN">Скільки монеток: <input type="number" id="gsN" class="numin" min="1" max="${Math.floor(W.coins)}" step="100" value="${Math.min(500, Math.floor(W.coins))}"></label><span class="small muted">У тебе ${Math.floor(W.coins).toLocaleString('uk-UA')}</span>`
       : st.kind==='food' ? `<label class="selrow" for="gsN">Скільки порцій: <input type="number" id="gsN" class="numin" min="1" max="${S.food}" step="5" value="${Math.min(10, S.food)}"></label><span class="small muted">У цьому будинку ${S.food} порцій</span>`
       : pets.length ? `<div class="pickgrid2 gpscroll" id="gpGrid" style="width:100%">${pets.map(c => `<button class="pickpet" type="button" data-gp="${c.id}" aria-pressed="${st.pet===c.id}">${catSVG(c, 'gp'+c.id)}<span>${esc(c.name)}</span><span class="small muted">${RAR_NAMES[COATS[c.coat].rar]} · рів. ${c.lvl}</span></button>`).join('')}</div><span class="small muted">Улюбленець переїде до друга разом з рівнем, зірками й бонусами. Секретних і тих, хто в дорозі, дарувати не можна.</span>` : '<span class="small muted">У цьому будинку немає улюбленців, яких можна подарувати.</span>'}
      <input type="text" id="gsMsg" maxlength="200" placeholder="Побажання (не обов’язково)" style="width:100%">
      <div class="btns" style="justify-content:center"><button class="btn" type="button" id="gsNo">Скасувати</button><button class="btn primary" type="button" id="gsYes">Подарувати</button></div></div></div>`;
    document.getElementById('gsNo').onclick = () => { root.innerHTML = ''; };
    document.getElementById('gfOv').onclick = e => {
      if (e.target.id==='gfOv'){ root.innerHTML = ''; return; }
      const k = e.target.closest('[data-gk]'); if (k){ st.kind = k.dataset.gk; draw(); return; }
      const p = e.target.closest('[data-gp]'); if (p){ st.pet = +p.dataset.gp; draw(); }
    };
    document.getElementById('gsYes').onclick = () => sendGift(toId, nick, st);
    const ng = document.getElementById('gpGrid'); if (ng) ng.scrollTop = sTop;
    document.getElementById('gsMsg').value = msgV;
  };
  draw();
}
async function sendGift(toId, nick, st){
  if (GIFTS.busy) return;
  const msg = (document.getElementById('gsMsg') || {}).value || '';
  let payload, c = null;
  if (st.kind==='pet'){
    c = catById(st.pet); if (!c || !canTrade(c)){ toast('Вибери улюбленця'); return; }
    payload = petPayload(c);
  } else {
    const n = Math.floor(+(document.getElementById('gsN') || {}).value || 0);
    const have = st.kind==='coins' ? Math.floor(W.coins) : S.food;
    if (!(n >= 1)){ toast('Впиши кількість'); return; }
    if (n > have){ toast(st.kind==='coins' ? 'Не вистачає монеток' : 'Не вистачає корму'); return; }
    if (st.kind==='coins' && n > 1000000){ toast('Щонайбільше 1 000 000 монеток за раз'); return; }
    payload = {n};
  }
  GIFTS.busy = true;
  const btn = document.getElementById('gsYes'); if (btn){ btn.disabled = true; btn.textContent = 'Надсилаю…'; }
  try {
    const { error } = await db().rpc('gift_send', {p_id: W.player.id, p_secret: W.player.secret, p_to: toId, p_kind: st.kind, p_payload: payload, p_msg: msg.slice(0, 200)});
    if (error) throw error;
    if (st.kind==='coins') W.coins -= payload.n;
    else if (st.kind==='food') S.food -= payload.n;
    else { S.cats = S.cats.filter(x => x !== c); renderScene(); }
    const what = giftText({kind: st.kind, payload});
    logEvent(`Подарунок для ${nick}: ${what}`);
    touch(true); renderTop();
    document.getElementById('modalRoot').innerHTML = '';
    toast(`Подарунок надіслано: ${what}`);
    task('gift');
    try {
      await db().rpc('chat_send', {p_id: W.player.id, p_secret: W.player.secret, p_to: toId, p_body: (tr(`🎁 Я надіслав тобі подарунок: ${what}`) + (msg ? '. ' + msg : '')).slice(0, 500), p_img: null});
      const ch = db().channel('kp-dm-' + toId, {config:{broadcast:{self:false}}});
      ch.subscribe(s => { if (s==='SUBSCRIBED'){ Promise.all([ch.send({type:'broadcast', event:'gift', payload:{from: W.player.id}}), ch.send({type:'broadcast', event:'m', payload:{from: W.player.id}})]).finally(() => setTimeout(() => db().removeChannel(ch), 800)); } });
    } catch(e){}
    if (playersSec==='chat' && CHAT.with===toId) chatLoad();
  } catch(e){
    const m = (e && e.message) || '';
    toast(/too many/i.test(m) ? 'Сьогодні вже надіслано забагато подарунків' : /no such player/i.test(m) ? 'Цього гравця немає в таблиці лідерів' : /not your player/i.test(m) ? 'Онови ім’я в таблиці лідерів' : 'Не вдалося надіслати подарунок. Перевір інтернет');
    if (btn){ btn.disabled = false; btn.textContent = 'Подарувати'; }
  }
  GIFTS.busy = false;
}
async function takeGift(id){
  const g = (GIFTS.rows||[]).find(x => x.id===id); if (!g || GIFTS.busy) return;
  if (g.kind==='pet'){ const sp = COATS[g.payload.coat].sp;
    if (!W.houses[sp]){ toast(`Спершу відкрий ${SPECIES[sp].house.toLowerCase()} на мапі`); return; }
    if (!spaceIn(sp)){ toast(`У будинку «${SPECIES[sp].house}» немає вільного місця`); return; } }
  GIFTS.busy = true;
  try {
    const { data, error } = await db().rpc('gift_take', {p_id: W.player.id, p_secret: W.player.secret, p_gift: id}); if (error) throw error;
    const p = data.payload || {};
    if (data.kind==='coins'){ const n = Math.max(0, Math.min(1000000, Math.floor(+p.n||0))); W.coins += n; toast(`+${n.toLocaleString('uk-UA')} монеток від ${data.nick}`); }
    else if (data.kind==='food'){ const n = Math.max(0, Math.min(100000, Math.floor(+p.n||0))); S.food += n; toast(`+${n} порцій корму від ${data.nick}`); }
    else { const c = receivePet(p, `Подарунок від ${data.nick}`); if (c) toast(`${c.name} тепер живе в тебе! Подарунок від ${data.nick}`); }
    logEvent(`Отримано подарунок від ${data.nick}: ${giftText(data)}`);
    GIFTS.rows = GIFTS.rows.filter(x => x.id !== id);
    touch(true); renderTop();
  } catch(e){ toast(/gone/i.test((e&&e.message)||'') ? 'Цей подарунок уже забрано' : 'Не вдалося забрати подарунок. Перевір інтернет'); loadGifts(); }
  GIFTS.busy = false; renderTab();
}
function viewGifts(){
  if (!chatOk()) return `<div class="card"><h2>Подарунки</h2><p class="small muted" style="margin:0">Щоб дарувати й отримувати подарунки, приєднайся до таблиці лідерів.</p><div class="btns"><button class="btn primary" data-act="psec" data-k="lb">До таблиці лідерів</button></div></div>`;
  if (!GIFTS.rows && !GIFTS.loading) loadGifts();
  let h = `<div class="section"><h2>Подарунки</h2><p class="small muted" style="margin:0">Даруй друзям золото, корм або улюбленців: кнопка «Подарунок» є в таблиці лідерів і в особистих розмовах. Подарунки, які надіслали тобі, чекають тут.</p>`;
  const rows = GIFTS.rows || [];
  if (!GIFTS.rows) h += `<div class="card"><p class="muted" style="margin:0">Завантажую…</p></div>`;
  else if (!rows.length) h += `<div class="card"><p class="muted" style="margin:0">Нових подарунків поки немає.</p></div>`;
  else h += `<div class="grid">${rows.map(g => `<article class="card giftcard"><div class="cathead"><div class="pic">${g.kind==='pet' ? catSVG({coat:g.payload.coat, wear:{}}, 'gr'+g.id) : g.kind==='coins' ? '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--gold)"/><circle cx="8" cy="8" r="4.3" fill="none" stroke="var(--surface)" stroke-width="1.3" opacity=".75"/></svg>' : ICON.food.replace('class="ic"','')}</div>
      <div style="min-width:0"><b>${giftText(g)}</b><span class="small muted">від <span data-nol10n>${esc(g.nick)}</span> · ${chatTime(g.at)}</span>${g.msg ? `<span class="small" data-nol10n>«${esc(g.msg)}»</span>` : ''}</div></div>
      <div class="btns"><button class="btn primary" data-act="gtake" data-id="${g.id}">Забрати</button><button class="btn" data-dmto="${esc(g.from)}" data-nick="${esc(g.nick)}">Подякувати</button></div></article>`).join('')}</div>`;
  const rows2 = (lb.rows||[]).filter(r => r.id !== W.player.id);
  if (!lb.rows) loadLeaderboard();
  h += `<div class="card"><b>Подарувати гравцю</b>${rows2.length ? rows2.slice(0, 30).map(r => `<div class="arroom"><span><b data-nol10n>${esc(r.nickname)}</b><br><span class="onl ${r.online?'on':''}"><i></i>${agoText(r.seen_ago, r.online)}</span></span><button class="btn primary" type="button" data-giftto="${esc(r.id)}" data-nick="${esc(r.nickname)}">🎁 Подарунок</button></div>`).join('') : '<span class="small muted">Гравців поки немає.</span>'}</div>`;
  return h + `</div>`;
}

async function evLoad(){
  if (!netReady() || EVT.busy) return;
  EVT.busy = true; EVT.at = now();
  try {
    const [a, e] = await Promise.all([db().rpc('announce_list'), db().rpc('events_active')]);
    if (!a.error) EVT.ann = (a.data || []).filter(Boolean);
    if (!e.error) EVT.list = (e.data || []).filter(x => x && EV_INFO[x.kind]);
  } catch(err){ console.warn(err); }
  EVT.busy = false; renderAnnBar(); annShowFull();
}
function renderAnnBar(){
  const el = document.getElementById('annBar'); if (!el) return;
  W.annSeen = W.annSeen || {}; W.evClaimed = W.evClaimed || {};
  const left = ms => { const h = Math.max(0, Math.round((ms - now())/3600000)); return h >= 48 ? `ще ${Math.round(h/24)} дн.` : h >= 1 ? `ще ${h} год` : 'ще менше години'; };
  let h = '';
  for (const e of EVT.list){ const I = EV_INFO[e.kind];
    h += `<div class="annb ev"><span class="annic">${I.ic}</span><span class="anntx"><b>${I.n}</b><span class="small">${I.d} · ${left(e.ends)}</span></span>${e.kind==='chest' && !W.evClaimed[e.id] ? `<button class="btn primary" type="button" data-evchest="${e.id}">Забрати</button>` : ''}</div>`; }
  for (const a of EVT.ann) if (a.kind==='banner' && !W.annSeen[a.id])
    h += `<div class="annb"><span class="annic">📣</span><span class="anntx">${a.title ? `<b data-nol10n>${esc(a.title)}</b>` : ''}${a.body ? `<span class="small" data-nol10n>${esc(a.body)}</span>` : ''}</span><button class="iconbtn" type="button" data-annclose="${a.id}" aria-label="Закрити"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`;
  el.innerHTML = h; el.hidden = !h;
}

function annShowFull(){

let backupAt = 0;
async function backupNow(){
  if (!netReady() || !W.player.nick || !W.player.id || visiting || lb.conflict) return;
  backupAt = now();
  try { const { error } = await db().rpc('backup_save', {p_id: W.player.id, p_secret: W.player.secret, p_state: serialize()}); if (error) throw error; } catch(e){ console.warn('backup', e); }
}
async function restoreCheck(){
  if (!netReady() || !W.player.nick || !W.player.id) return;
  try {
    const { data, error } = await db().rpc('restore_check', {p_id: W.player.id, p_secret: W.player.secret}); if (error || !data) return;
    const w = migrate(JSON.parse(data)); if (!w || !w.houses) return;
    w.player = Object.assign({}, W.player); w.savedAt = now(); for (const sp in w.houses) w.houses[sp].lastTick = now();
    adoptState(w); touch(true); try { await saveCloud(); } catch(e){}
    fullNotice({art:'🛠️', title:'Прогрес відновлено', body:'Розробник гри повернув твій притулок до збереженої версії. Приємної гри!'});
  } catch(e){ console.warn('restore', e); }
}

function devPetPayload(pre){
  const coat = val(pre+'Coat'); if (!COATS[coat]) return null;
  return {sp: COATS[coat].sp, coat, name: val(pre+'Name').trim().slice(0, 24), trait: rnd(TRAITS), lvl: clamp(nval(pre+'Lvl'), 1, CAT_MAX_LVL), stars: clamp(nval(pre+'Stars'), 0, STAR_MAX), perks: [], rerolls: 0};
}
async function devDo(act, el){
  const done = msg => { toast(msg); touch(true); renderAll(); devRender(); };
  try {
    if (act==='addres'){
      W.coins += Math.max(0, nval('dvCoins')); S.food += Math.max(0, nval('dvFood')); S.xp += Math.max(0, nval('dvXp'));
      const sx = Math.max(0, nval('dvSxp')); if (sx){ seasonEnsure(); W.season.xp = Math.min(SEASON_XP*SEASON_MAX, W.season.xp + sx); }
      addShards(val('dvShCoat'), Math.max(0, nval('dvSh'))); S.tokens = (S.tokens||0) + Math.max(0, nval('dvTok'));
      lastLevel = level(); done('Ресурси додано');
    } else if (act==='mkpet'){
      const o = devPetPayload('dp'); if (!o) return;
      if (!W.houses[o.sp]){ W.houses[o.sp] = newHouse(o.sp); bindShared(W.houses[o.sp]); }
      const n = clamp(nval('dpN'), 1, 30); let last = null;
      for (let i = 0; i < n; i++){ last = receivePet(Object.assign({}, o, {name: o.name && n > 1 ? `${o.name} ${i+1}` : o.name}), 'Створено в панелі розробника'); }
      done(n > 1 ? `Створено ${n} улюбленців у будинку «${SPECIES[o.sp].house}»` : `${last ? last.name : 'Улюбленець'} з’явився в будинку «${SPECIES[o.sp].house}»`);
    } else if (act==='warp'){
      const ms = (+el.dataset.h) * 3600000;
      for (const sp of ownedSp()){ const h = W.houses[sp]; h.lastTick -= ms; for (const x of h.exp) x.endsAt -= ms; for (const a of h.active) a.endsAt -= ms; }
      document.getElementById('modalRoot').innerHTML = ''; catchUp(); touch(true); renderAll(); toast(`Час перемотано на ${el.dataset.h} год`);
    } else if (act==='finexp'){ for (const sp of ownedSp()) for (const x of W.houses[sp].exp) x.endsAt = now() - 1000; done('Усі експедиції завершено, забери нагороди на вкладці «Пригоди»'); }
    else if (act==='finres'){ for (const sp of ownedSp()) for (const a of W.houses[sp].active) a.endsAt = now() - 1000; done('Усі порятунки завершено'); }
    else if (act==='rstreak'){ W.streak = {day:'', n:0}; done('Щоденну серію скинуто'); }
    else if (act==='rdaily'){ for (const sp of ownedSp()) W.houses[sp].daily = {day:'', tasks:[], chest:false}; ensureDaily(); done('Щоденні завдання оновлено'); }
    else if (act==='rseason'){ seasonEnsure(); W.season.day = ''; W.season.week = ''; seasonEnsure(); done('Завдання сезону оновлено'); }
    else if (act==='rquest'){ for (const sp of ownedSp()) W.houses[sp].quest = {ch:0, st:0, have:0}; done('Сюжетні квести почнуться спочатку'); }
    else if (act==='rtut'){ W.tutDone = 0; document.getElementById('modalRoot').innerHTML = ''; touch(true); startTutorial(); }
    else if (act==='rpwa'){ W.pwaSeen = 0; document.getElementById('modalRoot').innerHTML = ''; touch(true); if (pwaHost() && !isStandalone()) pwaNotice(); else toast('Оголошення з’явиться тільки на сайті, якщо гру ще не встановлено'); }
    else if (act==='annsend'){
      const title = val('daTitle').trim(), body = val('daBody').trim(); if (!title && !body){ toast('Напиши текст оголошення'); return; }
      el.disabled = true; await devRpc('admin_announce', {p_kind: val('daKind'), p_title: title, p_body: body, p_hours: clamp(nval('daH'), 1, 1440)});
      await evLoad(); done('Оголошення опубліковано');
    } else if (act==='annoff'){ await devRpc('admin_announce_off', {p_ann: +el.dataset.id}); await evLoad(); done('Оголошення вимкнено'); }
    else if (act==='evon'){ el.disabled = true; await devRpc('admin_event', {p_kind: el.dataset.k, p_hours: clamp(nval('deH'), 1, 336)}); await evLoad(); done(`Подію «${EV_INFO[el.dataset.k].n}» увімкнено`); }
    else if (act==='evoff'){ await devRpc('admin_event_off', {p_event: +el.dataset.id}); await evLoad(); done('Подію вимкнено'); }
    else if (act==='gift'){
      const kind = val('dgKind'), to = val('dgTo') || null; let payload;
      if (kind==='pet'){ payload = devPetPayload('dg'); if (!payload) return; if (!payload.name) payload.name = rnd(NAMES_BY[payload.sp] || NAMES); }
      else { const n = clamp(nval('dgN'), 1, 1000000); payload = {n}; }
      el.disabled = true; const n = await devRpc('admin_gift', {p_to: to, p_kind: kind, p_payload: payload, p_msg: val('dgMsg').slice(0, 200)});
      done(`Подарунок надіслано: ${giftText({kind, payload})} · отримувачів: ${n}`);
    } else if (act==='stats'){ DEV.busy = true; try { DEV.stats = await devRpc('admin_stats'); } finally { DEV.busy = false; } devRender(); }
    else if (act==='bkget'){ DEV.bkFor = val('dsWho'); if (!DEV.bkFor) return; DEV.backup = (await devRpc('admin_backup_get', {p_player: DEV.bkFor})) || false; devRender(); }
    else if (act==='restore'){
      const b = DEV.backup; if (!b || !b[el.dataset.k]) return;
      if (el.dataset.arm !== '1'){ el.dataset.arm = '1'; el.textContent = 'Точно? Натисни ще раз'; setTimeout(() => { if (el.isConnected){ el.dataset.arm = ''; el.textContent = 'Повернути гравцю цю версію'; } }, 5000); return; }
      el.disabled = true; await devRpc('admin_restore', {p_player: DEV.bkFor, p_state: b[el.dataset.k]});
      if (DEV.bkFor === W.player.id){ document.getElementById('modalRoot').innerHTML = ''; await restoreCheck(); return; }
      done('Готово. Гравець отримає цю версію при наступному вході в гру');
    }
  } catch(e){ console.warn(e); toast('Не вийшло: ' + ((e && e.message) || e)); if (el) el.disabled = false; }
}

/* ---------- стрічка новин: помічаємо важливе самі ---------- */
function feedScan(){
  if (!W || visiting || !chatOk()) return;
  const F = W.feedSt || (W.feedSt = {init:0, pets:{}, houses:{}, lvl:{}, sz:''});
  const first = !F.init;
  for (const sp of ownedSp()){ const h = W.houses[sp];
    if (!F.houses[sp]){ F.houses[sp] = 1; if (!first) feedPost('house', {sp}); }
    let l = 1; while ((h.xp||0) >= xpNeed(l)) l++;
    const was = F.lvl[sp] || l; if (!first && Math.floor(l/5) > Math.floor(was/5)) feedPost('level', {sp, l: Math.floor(l/5)*5}); F.lvl[sp] = l;
    for (const c of h.cats){ const k = COATS[c.coat]; if (!k || c.borrowed) continue; const key = sp + ':' + c.id;
      if (F.pets[key]) continue; F.pets[key] = 1;
      if (first || k.rar < 5) continue;
      feedPost(k.secret==='dev' ? 'dev' : k.secret ? 'secret' : k.rar >= 6 ? 'divine' : 'mythic', {coat: c.coat, name: String(c.name).slice(0, 24)}); }
  }
  const sz = W.season ? W.season.id + ':' + seasonLvl() : '';
  if (W.season){ const L = seasonLvl(), prev = F.sz && F.sz.split(':')[0]===W.season.id ? +F.sz.split(':')[1] : L;
    if (!first) for (const m of [25, 50, 75, 100]) if (prev < m && L >= m) feedPost('season', {l: m}); }
  F.sz = sz; F.init = 1;
}
function feedText(e){
  const d = e.data || {}, k = COATS[d.coat], pet = k ? `«${esc(k.n)}»` : '';
  switch (e.kind){
    case 'divine': return `отримав божественного улюбленця ${pet}`;
    case 'mythic': return `отримав міфічного улюбленця ${pet}`;
    case 'secret': return `знайшов секретного улюбленця ${pet}`;
    case 'dev': return `отримав ексклюзивного улюбленця ${pet} від розробника`;
    case 'house': return SPECIES[d.sp] ? `відкрив будинок «${SPECIES[d.sp].house}»` : 'відкрив новий будинок';
    case 'level': return SPECIES[d.sp] ? `${SPECIES[d.sp].house}: рівень ${+d.l||0}!` : `новий рівень притулку`;
    case 'season': return `сезонний пропуск: рівень ${+d.l||0}`;

  }
  return '';
}

/* ---------------- мапа будинків ---------------- */
const MAP_POS = {cat:[96,84], dog:[262,78], rat:[92,196], fish:[266,192]};
const ROOF = {cat:'#D94F74', dog:'#2A8F7A', rat:'#7652C4', fish:'#2E7FB8'};
const catHouseLevel = () => { let l = 1; while ((W.houses.cat.xp||0) >= xpNeed(l)) l++; return l; };
function houseInfo(sp){
  const h = W.houses[sp], d = SPECIES[sp];
  if (!h) return {own:false, price:d.price, req:d.req, can: W.coins >= d.price && catHouseLevel() >= d.req, lvlOk: catHouseLevel() >= d.req};
  const lvl = withHouse(h, level), inc = withHouse(h, incomePerMin);
  const care = h.cats.filter(c => !c.away && (c.hunger < 35 || c.happy < 35 || (c.sick && !c.treatUntil))).length;
  const ready = h.active.some(a => now() >= a.endsAt) || (h.exp||[]).some(e => now() >= e.endsAt);
  return {own:true, lvl, pets:h.cats.length, inc, care, ready};
}
function houseSVG(sp, x, y, own){
  const r = own ? ROOF[sp] : '#A99FBD', wall = own ? '#FBF3E6' : '#E6E0EE';
  return `<g transform="translate(${x} ${y})">
    <ellipse cx="0" cy="30" rx="44" ry="9" fill="rgb(0 0 0 / .12)"/>
    ${sp==='fish' ? `<rect x="-36" y="-14" width="72" height="44" rx="8" fill="${own?'#9FD3EC':'#D6E6EE'}" stroke="${own?'#2E7FB8':'#A99FBD'}" stroke-width="3"/><path d="M-30 18q10-8 20 0t20 0t20 0" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>` :
      `<rect x="-30" y="-6" width="60" height="36" rx="3" fill="${wall}" stroke="#8A6A52" stroke-width="2"/><path d="M-38 -4L0 -34L38 -4Z" fill="${r}" stroke="#7A3F22" stroke-width="2" stroke-linejoin="round"/><rect x="-8" y="10" width="16" height="20" rx="7" fill="#8A6A52"/><rect x="14" y="2" width="11" height="10" rx="2" fill="#BFE3F5" stroke="#8A6A52" stroke-width="1.5"/>`}
    <circle cx="0" cy="${sp==='fish'?-30:-46}" r="17" fill="var(--surface)" stroke="${own ? r : '#A99FBD'}" stroke-width="2.5"/>
    <svg x="-14" y="${sp==='fish'?-44:-60}" width="28" height="28" viewBox="0 0 100 100" ${own?'':'opacity=".45"'}>${animalInner({coat:SPECIES[sp].start, wear:{}}, 'map'+sp)}</svg>
    ${own ? '' : `<g transform="translate(0 ${sp==='fish'?4:12})"><rect x="-8" y="-2" width="16" height="13" rx="3" fill="#6E6482"/><path d="M-5 -2v-4a5 5 0 0 1 10 0v4" stroke="#6E6482" stroke-width="2.4" fill="none"/></g>`}
  </g>`;
}
function openMap(){
  if (visiting) return;
  closeSheets();
  const root = document.getElementById('modalRoot');
  const P = (a, b) => { const [x1,y1] = MAP_POS[a], [x2,y2] = MAP_POS[b]; return `<path d="M${x1} ${y1+30}Q${(x1+x2)/2} ${(y1+y2)/2+40} ${x2} ${y2+30}" stroke="#E9D7A8" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M${x1} ${y1+30}Q${(x1+x2)/2} ${(y1+y2)/2+40} ${x2} ${y2+30}" stroke="#D8C08E" stroke-width="2" stroke-dasharray="4 7" fill="none"/>`; };
