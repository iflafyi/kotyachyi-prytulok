    <g fill="#8CCB6E">${Array.from({length:40},(_,i)=>`<path d="M${(i*53)%350+5} ${(i*37)%255+8}l3-7l3 7z"/>`).join('')}</g>
    <path d="M190 270Q200 220 250 238T360 222V270Z" fill="#7FC4E8"/><path d="M205 262Q230 236 270 248T350 236" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/>
    ${P('cat','dog')}${P('cat','rat')}${P('rat','fish')}${P('dog','fish')}
    ${[[30,24],[330,30],[20,140],[178,140],[340,120],[176,30],[30,250]].map(([x,y])=>`<g transform="translate(${x} ${y})"><rect x="-2" y="2" width="4" height="10" fill="#8A5A3A"/><circle r="10" fill="#4E9A54"/><circle cx="-5" cy="4" r="7" fill="#5FAE62"/></g>`).join('')}
    ${SP_ORDER.map(sp => `<g class="maphouse ${W.cur===sp?'here':''}" data-house="${sp}" role="button" tabindex="0" aria-label="${SPECIES[sp].house}">${houseSVG(sp, ...MAP_POS[sp], !!W.houses[sp])}</g>`).join('')}
  </svg>`;
  const cards = SP_ORDER.map(sp => {
    const d = SPECIES[sp], i = houseInfo(sp), here = W.cur===sp;
    let body, btn;
    if (i.own){
      body = `<span class="small muted">Рівень ${i.lvl} · улюбленців ${i.pets} · ≈${i.inc.toFixed(1)} монеток/хв</span>${i.care ? `<span class="rar sick">Потребують уваги: ${i.care}</span>` : ''}${i.ready ? '<span class="rar r1">Є що забрати</span>' : ''}`;
      btn = here ? '<span class="rar r1">Ти тут</span>' : `<button class="btn primary" type="button" data-go="${sp}">Перейти</button>`;
    } else {
      body = `<span class="small muted">${i.lvlOk ? 'Можна купити' : `Потрібен ${d.req} рівень котячого притулку`}</span>`;
      btn = `<button class="btn primary" type="button" data-buy="${sp}" ${i.can ? '' : 'disabled'}>${ICON.coin} ${d.price.toLocaleString('uk-UA')} · Купити</button>`;
    }
    return `<div class="card mapcard ${here?'here':''}"><div class="cathead"><div class="pic">${catSVG({coat:d.start, wear:{}}, 'mc'+sp)}</div><div style="min-width:0"><b>${d.house}</b>${body}</div></div><div class="btns">${btn}</div></div>`;
  }).join('');
  root.innerHTML = `<div class="overlay" id="mapOverlay" data-raw><div class="modal mapmodal" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
    <div class="sheethead" style="width:100%"><h2 id="mapTitle">Мапа притулків</h2><button class="iconbtn" type="button" id="mapClose" aria-label="Закрити"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="small muted" style="margin:0">Золото спільне для всіх будинків. Кожен будинок має своїх улюбленців, рівень і покращення, а приносить монетки, навіть коли ти в іншому.</p>
    ${svg}<div class="mapcards">${cards}</div></div></div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('mapClose').onclick = close;
  document.getElementById('mapOverlay').addEventListener('click', e => {
    if (e.target.id==='mapOverlay') return close();
    const go = e.target.closest('[data-go]'), buy = e.target.closest('[data-buy]'), hs = e.target.closest('[data-house]');
    if (go){ close(); switchHouse(go.dataset.go); }
    else if (buy && !buy.disabled) buyHouse(buy.dataset.buy);
    else if (hs){ const sp = hs.dataset.house; if (W.houses[sp]){ if (sp!==W.cur){ close(); switchHouse(sp); } } else root.querySelector(`[data-buy="${sp}"]`)?.focus(); }
  });
  root.querySelectorAll('[data-house]').forEach(g => g.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); g.dispatchEvent(new MouseEvent('click', {bubbles:true})); } }));
}
function buyHouse(sp){
  const d = SPECIES[sp]; if (!d || W.houses[sp]) return;
  if (W.coins < d.price || catHouseLevel() < d.req) return;
  W.coins -= d.price;
  const h = newHouse(sp); bindShared(h); W.houses[sp] = h;
  withHouse(h, () => { spawnMissions(true); ensureDaily(); });
  logEvent(`Відкрито новий будинок: ${d.house}!`);
  document.getElementById('modalRoot').innerHTML = '';
  switchHouse(sp);
  toast(`${d.house} відкрито! Тут живе ${SPECIES[sp].startName}. Знайомся з новими улюбленцями`);
  touch(true);
}
function switchHouse(sp){
  if (!W.houses[sp] || visiting) return;
  if (laser.on) setLaser(false);
  if (fish.running) endFish(true);
  closeSheets(); closeChat();
  W.cur = sp; S = W.houses[sp];
  if (!S.missions.length && !S.active.length) spawnMissions(true);
  ensureDaily(); spawnVisitors(true);
  if (!roomOwned(S.curRoom)) S.curRoom = 'main';
  for (const c of S.cats) ensurePerks(c);
  brains.clear(); lifeMounted = false; reset3DCats(); catsSig = '';
  lastLevel = level(); shownCoins = null; catUI.filter = 'all'; mergeUI.sel = []; shopSec = 'wheel';
  document.getElementById('modalRoot').innerHTML = '';
  renderAll(); renderSoundBtn(); applyTheme();
  if (S.wheel.pending && COATS[S.wheel.pending.coat]) setTimeout(()=>openNaming(S.wheel.pending, true), 400);
  touch(true);
}
function renderMapDot(){
  const b = document.getElementById('mapDot'); if (!b || !W) return;
  const others = SP_ORDER.filter(sp => sp!==W.cur);
  b.hidden = !others.some(sp => { const i = houseInfo(sp); return i.own ? (i.care || i.ready) : i.can; });
}

/* ---------------- loop ---------------- */
let catsSig = '';
function loop(){
  pushProfile(false);
  if (visiting) return;
  if (tab==='players' && netReady() && now()-lb.at > 30000) loadLeaderboard();
  if (netReady() && W.player.nick && now()-trade.at > (tab==='players' && playersSec==='trade' ? 30000 : 180000)) loadTrades();
  const t = now();
  const dt = Math.min(5, (t - S.lastTick)/1000);
  S.lastTick = t;
  const before = Math.floor(S.coins);
  simulate(dt);
  for (const sp of ownedSp()){ const h = W.houses[sp]; if (h===S) continue;
    withHouse(h, () => { const d = Math.min(5, Math.max(0, (t - (h.lastTick||t))/1000)); h.lastTick = t; simulate(d); spawnMissions(false); spawnVisitors(false); careTick(true); }); }
  const added = spawnMissions(false);
  const vAdded = spawnVisitors(false);
  if (vAdded && tab==='earn' && !fish.running) renderTab();
  if (Math.floor(S.coins)!==before) dirty = cloudDirty = true;
  renderTop();
  if (added && tab==='rescue') renderTab(); else liveUpdate();
  if (added) toast('Новий виклик: комусь потрібна допомога!');
  careTick(false);
  checkAch();
  const sig = S.sp + S.cats.map(c=>c.id+(c.room||'')+(c.treatUntil?'t':'')+(c.away?'a':'')).join(',') + '|' + Object.values(S.upgrades).join('') + '|' + S.curRoom + extraRooms();
  if (sig!==catsSig){ catsSig=sig; renderScene(); }
  if (streakDue() && t - (loop.stk||0) > 60000 && tutI < 0 && !fish.running && !spinning){ loop.stk = t; showStreak(); }
  if (dirty && t-lastLocal>5000) saveLocal();
  if (cloudDirty && t-lastCloud>30000) saveCloud();
}

function start(data){
  setWorld((data && data.state && migrate(data.state)) || loadLocal() || newWorld());
  LANG = W.settings.lang==='ru' ? 'ru' : 'uk';
  document.documentElement.lang = LANG;
  if (LANG==='ru'){ document.title = tr(document.title); l10nNode(document.body); }
  if (!S.missions.length && !S.active.length) spawnMissions(true);
  ensureDaily(); spawnVisitors(true);
  if (!roomOwned(S.curRoom)) S.curRoom = 'main';
  for (const c of S.cats) ensurePerks(c);
  for (const c of S.cats) if (!roomOwned(c.room||'main')) c.room = 'main';
  catchUp();
  lastLevel = level();
  document.getElementById('coinIcon').innerHTML = ICON.coin;
  document.getElementById('foodIcon').innerHTML = ICON.food;
  renderAll();
  renderSoundBtn();
  requestAnimationFrame(frame);
  document.getElementById('viewBtn').addEventListener('click', ()=>{
    if (R3.state==='failed' && S.settings.view3d!==false){ R3.state = 'off'; R3.failKind = null; setView(); return; }
    S.settings.view3d = S.settings.view3d===false; touch(); setView(); });
  document.getElementById('playersTab').hidden = !netReady();
  document.getElementById('mapBtn').addEventListener('click', openMap);
  document.getElementById('setBtn').addEventListener('click', () => { if (document.getElementById('setSheet').hidden) openSheet('setSheet'); else closeSheets(); });
  document.getElementById('logBtn').addEventListener('click', () => { if (document.getElementById('logSheet').hidden) openLog(); else closeSheets(); });
  document.querySelectorAll('.sheet').forEach(sh => sh.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheets(); }));
  document.getElementById('catSheet').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    actions[b.dataset.act]?.(b); setTimeout(renderCatSheet, 0);
  });
  document.getElementById('langSeg').addEventListener('click', async e => { const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang===LANG) return;
    S.settings.lang = b.dataset.lang; b.disabled = true; touch(true); saveLocal(); try { await saveCloud(); } catch(_){} location.reload(); });
  document.querySelectorAll('#langSeg [data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang===LANG));
  document.getElementById('themeSeg').addEventListener('click', e => { const b = e.target.closest('[data-theme-set]'); if (!b) return; S.settings.theme = b.dataset.themeSet; touch(true); applyTheme(); });
  document.getElementById('tutBtn').addEventListener('click', startTutorial);
  document.addEventListener('keydown', e => { if (e.key==='Escape'){ if (tutI>=0) endTutorial(); else closeSheets(); } });
  applyTheme(); renderBell();
  if (!S.tutDone && S.stats.pets < 3 && S.stats.rescued === 0) setTimeout(() => { if (tutI < 0 && !visiting) startTutorial(); }, 1500);
  document.getElementById('visitBack').addEventListener('click', endVisit);
  document.getElementById('retry3d').addEventListener('click', ()=>{ R3.state = 'off'; R3.failKind = null; S.settings.view3d = true; setView(); });
  document.getElementById('fsBtn').addEventListener('click', toggleFs);
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  setView();
  try { seasonEnsure(); } catch(e){}
  try { devStart(); } catch(e){ console.warn(e); }
  try { socStart(); lendTick(); } catch(e){ console.warn(e); }
  setTimeout(() => { try { if (chatOk()){ chatSubscribe(); chatCheckUnread(); loadGifts(); } } catch(e){} }, 4000);
  if (S.wheel.pending && COATS[S.wheel.pending.coat]) setTimeout(()=>openNaming(S.wheel.pending, true), 600);
  else if (S.tutDone || S.stats.rescued > 0) setTimeout(showStreak, 1800);
  saveLocal();
  setSaveStatus('device');
  initCloud();
  setInterval(loop, 1000);
}
/* ================= Простий хостинг: збереження в браузері + оновлення ================= */
const BUILD = '2026102504';
aiOff = true; sampleFn = null;   // живі розмови з Claude тут не підключені — котики відповідають готовими фразами
async function checkUpdate(){
  try { const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' }); if (!r.ok) return;
    const v = await r.json(); if (v.build && v.build !== BUILD) document.getElementById('updBar').hidden = false; } catch(e){}
}
document.getElementById('updBtn').addEventListener('click', () => { if (S) saveLocal(); location.reload(); });
setInterval(checkUpdate, 5*60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
window.addEventListener('pagehide', () => { if (S) saveLocal(); });
/* Переїзд зі старої адреси: стара сторінка передає збереження в #kpmove=… (стиснуте) або #kpmovej=… */
async function kpImport(){
  const h = location.hash || ''; let raw = null;
  try {
    if (h.startsWith('#kpmove=')){
      let b = h.slice(8).replace(/-/g,'+').replace(/_/g,'/'); while (b.length % 4) b += '=';
      const bytes = Uint8Array.from(atob(b), ch => ch.charCodeAt(0));
      raw = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    } else if (h.startsWith('#kpmovej=')) raw = decodeURIComponent(h.slice(9));
  } catch(e){ console.warn('kpImport', e); }
  if (h.startsWith('#kpmove')) try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (!raw) return;
  try {
    const inc = migrate(JSON.parse(raw)); if (!inc || !inc.houses) return;
    const score = w => Object.values(w.houses||{}).reduce((a, x) => a + (+x.xp||0), 0);
    let cur = null; try { const r = localStorage.getItem(LOCAL_KEY); cur = r ? migrate(JSON.parse(r)) : null; } catch(e){}
    if (cur && cur.houses && (score(cur) > score(inc) || (score(cur) === score(inc) && (cur.savedAt||0) >= (inc.savedAt||0)))) return;
    localStorage.setItem(LOCAL_KEY, raw);
    setTimeout(() => toast('Прогрес перенесено на нову адресу гри 🐾'), 1500);
  } catch(e){ console.warn('kpImport', e); }
}
kpImport().finally(() => start({}));
